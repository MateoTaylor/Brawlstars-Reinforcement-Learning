# brawl_vision tunables. See Terrain_Perception_Build_Plan.md and brawl_vision/config.py.
#
# SETTINGS live here -- numbers you tune by hand, where a different value is a different
# judgment call. MEASUREMENTS live in brawl_vision/data/*.json (the homography, the HUD
# rectangles): those are outputs of a calibration script, regenerated rather than edited.
#
# READ THIS BEFORE TRUSTING ANY NUMBER BELOW. Most of these are PLACEHOLDERS -- nobody has
# pointed this pipeline at real footage yet. Every value that has not been measured says so and
# names the phase that replaces it. Treating an unmeasured default as a finding is exactly the
# failure this file is commented to prevent.

capture:
  monitor: 1          # mss monitor index; 0 is the virtual "all screens" rectangle
  # 20 Hz, matching the sim's tick rate (configs/default.yaml sim.dt: 0.05). Note this is NOT
  # the decision rate: sim.action_repeat: 5 makes one agent decision cover 5 ticks, so the
  # pipeline's real budget is 4 Hz / 250 ms. Capturing at the tick rate rather than the
  # decision rate gives odometry (Phase F) more, smaller inter-frame shifts to correlate,
  # which is the regime cv2.phaseCorrelate is most accurate in.
  target_fps: 20.0
  # Brightness above which a pixel counts as rendered content rather than a letterbox bar.
  # 25, not 0 and not 12: compression does not preserve pure black, and the ramp at a hard
  # bar/content boundary measured 11-16 on real footage -- so 12 admits ringing as "content" and
  # made the detected left edge wander over 194..216 frame to frame. At 25 the same clip's right
  # edge is rock steady at 2217 and the left clusters at 206.
  black_level: 25
  # MEASURED, not a placeholder and not a tuning knob. Solo Showdown constricts the visible WIDTH
  # relative to other modes, at the same zoom, to keep matches fair -- 2002x1126 (exactly 16:9)
  # against the training cave's full-screen 2436x1126, both at ~77 px/tile. Every frame is symmetrically
  # trimmed to this aspect before anything else touches it, which is what lets ONE homography
  # serve every mode. Expressed as an aspect rather than a pixel width so it survives a
  # resolution change. See Terrain_Perception_Build_Plan.md Section 3.
  normalized_aspect: 1.7777778    # 16 / 9

odometry:                 # Phase F
  # MEASURED. A PER-WINDOW floor: windows below it are dropped, and a frame left with fewer
  # than min_windows is called a cut. Good frames sit at p01 = 0.20-0.95 across all seven
  # fixtures; the one real cut (training_gadget f508) leaves a single window at 0.132.
  # This floor alone is NOT sufficient -- a window locked onto a moving sprite scores
  # 0.92-0.98 while reporting pure fiction. See min_agreement_ratio for what catches that.
  min_response: 0.10
  # MEASURED. The fastest thing in the game is not a walk -- Mortis's charged dash covers 5.34
  # tiles in 0.30 s (17.8 tiles/s), i.e. 0.89 tiles per frame at 20 Hz, against 0.137 for the
  # fastest walk. 2.0 leaves 2.2x headroom over the dash and still catches the one real cut in
  # the fixtures (a 3.3-tile jump). This bound is per FRAME, not per second.
  #
  # **The deployed loop now runs at 12 Hz, not 20** (BRAWL_DEPLOYMENT_DESIGN.md 6.13), which puts
  # a charged dash at 1.48 tiles per frame -- 74% of this bound, 1.35x headroom instead of 2.2x.
  # 2.0 is KEPT rather than raised: the cut it has to catch is a camera teleport, whose size does
  # not depend on the frame rate, so raising this would spend the margin that matters to buy
  # margin on the side that is still comfortable. `brawl_deployment/config.py` enforces the pairing
  # -- `validate` refuses any tick rate that puts the dash past this number, which is why 8 Hz is
  # not an option there. Re-measure before deploying a brawler faster than Mortis.
  max_shift_tiles: 2.0
  # Correlation window geometry. ONE window over the whole patch does not work: measured on
  # counted_walking.mp4, a single 823x581 window reports 2.8 tiles of camera travel across a
  # stretch where the background is provably identical -- phase correlation locked onto the
  # moving sprites. A grid of windows plus a median outvotes them. 192/192 gives 11 windows at
  # 4.5 ms/frame; 128/128 gives 33 at 4.1 ms and 256/256 gives 4 at 3.2 ms, and all three agree
  # on a real camera leg within 0.2 tiles -- so this is a cost choice, not an accuracy one.
  window_px: 192
  stride_px: 192
  min_windows: 4
  # How far a per-window estimate may sit from the median and still COUNT AS AGREEING. It is the
  # tolerance min_agreement_ratio is measured against, not a threshold of its own. Steady tracking
  # measures 0.002 tiles of median disagreement, three orders below this.
  max_disagreement_tiles: 0.25
  # Share of windows that must agree for a frame to be TRUSTED. Below it the frame is still
  # integrated, just marked 'uncertain' so Phase I can decline to vote on it -- it is not a cut
  # threshold. Measured: median 1.0 and p01 >= 0.90 on every clip, while a real camera cut goes
  # to 0.0. Median deviation alone would not work here, because a coherent split (half the patch
  # sliding one way, half the other) puts the median inside one group and drives it to zero.
  min_agreement_ratio: 0.75

zone:                     # Phase G
  # MEASURED (Phase G) on three visually different maps: zone_grows_from_east,
  # showdown_alternate_map and showdown_has_gadget, sampled before, during and after a shrink.
  #
  # The band is carried by S and V, not H. On showdown_alternate_map the BUSHES are yellow-green
  # with a median hue of 60 -- the same hue as the gas -- and a hue-only band flags 11.5% of that
  # frame against 4.0% for this one, swallowing the whole bush strip. Gas is a bright, washed-out
  # overlay; foliage is dark, saturated and textured. That is the separation, and it is why this
  # threshold was not shippable until a second map with green foliage existed.
  #
  # OpenCV 8-bit HSV: H is 0-179 (a HALF-degree hue wheel, not 0-359), S and V are 0-255.
  # Writing a 0-359 hue is the easiest mistake here and yields an empty mask rather than an
  # error, so brawl_vision.config.validate range-checks it.
  #
  # H may wrap (low > high) for a hue range spanning red; S and V may not. validate enforces
  # exactly that asymmetry, and zone.detect_zone implements the wrap as a union of two bands.
  hsv_low:  [42, 60, 185]
  hsv_high: [75, 165, 255]
  # Opening kernel in rectified pixels. Clouds are tens of pixels across; the false positives that
  # survive the colour band (damage numbers, pickup glints, a nameplate) are not.
  open_px: 9
  # Share of a cell that must be real world before the cell is judged at all. Mostly-occluded
  # cells are UNKNOWN, not clear.
  min_cell_pixels: 0.5
  # Fraction of a cell's pixels inside the threshold for the CELL to count as gassed. Above 0.5
  # so a cell straddling the gas boundary resolves to whichever side owns most of it instead of
  # flickering frame to frame.
  min_cell_fraction: 0.6

occupancy:                # Phase I
  # The accumulated per-match grid. Sized generously rather than to a real map: this system has
  # no pre-built reference to align to, so the origin is wherever tracking started and the
  # camera can walk off in any direction from it. 128 is ~2x the sim's 60x60 map in every
  # direction before the grid would need to grow.
  grid_h: 128
  grid_w: 128
  # PLACEHOLDER -- set against the hand-verified ground-truth grid in Phase I.
  # Minimum observations before a cell may lock, and the share of those votes the winning class
  # must hold. Both trade map-fill speed against the risk of locking a misclassification, and
  # LOCKING IS FOREVER (nothing reclassifies a locked cell for the rest of the match), so err
  # high. lock_ratio must exceed 1/5: with five terrain classes an even split would otherwise
  # clear the bar and lock whatever the first min_votes frames happened to see.
  min_votes: 5
  lock_ratio: 0.8

classifier:               # Phase H
  # MEASURED 2026-09-08 and moved, which is what the previous comment here asked for. It read:
  # "at deploy time the GPU is busy running the policy... measure before moving it." Both halves
  # turned out otherwise. The policy runs on the CPU in deployment (configs/deployment.yaml's
  # policy_device, measured faster there than on CUDA for a network this small), so the GPU is
  # running only the two detectors; and the budget that binds is the 50 ms PERCEPTION tick, not
  # the 250 ms decision -- brawl_deployment/loop.py deposits terrain at 20 Hz because a skipped
  # frame is evidence thrown away.
  #
  # 40 frames of bluestacks-example-new at the deployment viewport, after warm-up:
  #   cpu    median 9.26 ms   p95  9.98   max 10.63
  #   cuda   median 5.86 ms   p95  6.04   max  6.20
  # and the two agree on EVERY cell of every frame (max disagreement 0.00000 over 10 frames), so
  # this is 3.4 ms of a tight tick budget for an identical map. Driver: scratchpad/classifier_device.py.
  device: cuda

detector:                 # brawl_vision/object_detection -- third-party YOLO over the RAW frame
  # Which fetched model to run. Names are keys of object_detection/weights.MODELS, not paths:
  # the file is downloaded rather than committed, so a path here would point at nothing on a
  # fresh clone. See object_detection/weights/NOTICE.md for what these are and where from.
  model: entity_v2
  # MEASURED across three Solo Showdown fixtures (showdown_alternate_map, _map2, _has_gadget;
  # 101 frames, every 40th, floor 0.20). The two classes behave completely differently:
  #
  #   player   n=103  median 0.91, p05 0.81 -- flat from 0.35 to 0.70, 98% survive either way
  #   enemy    n=112  median 0.86, p25 0.67, p05 0.28 -- a long low tail
  #
  # So this threshold is entirely a statement about ENEMIES; the player box is insensitive to it.
  # The tail is not noise, it is occlusion -- an enemy half behind a bush or leaving the frame,
  # which is exactly when you want it. 0.5 keeps 95 of the 112; PylaAI's 0.6 drops 6 more of
  # those, and 0.35 adds 6 back. 0.5 sits at the knee. This is three clips of one game mode, not
  # a law: re-measure before trusting it on a map that looks different.
  conf: 0.5
  # Class-wise NMS overlap. PylaAI's value, unmeasured here and left alone: brawlers do not
  # stack, so the duplicate-suppression regime this controls is barely exercised.
  iou: 0.6
  # Classes dropped after NMS. 'teammate' is meaningless in Solo Showdown, which is the mode this
  # project targets -- and at conf 0.5 it is nearly a no-op anyway: 1 teammate box in those same
  # 101 frames, against 7 if the floor drops to 0.20 (median 0.24, i.e. noise). Its real value is
  # as a canary, because the ONE thing that makes it fire in bulk is a corrupted input -- fed BGR
  # instead of RGB the same footage yields 44 teammate boxes where correct input yields none (see
  # detector.py). Empty this list when debugging the detector rather than using it.
  ignore: [teammate]
  # auto | cpu | cuda. 'auto' takes CUDA when the onnxruntime-gpu build is installed and CPU
  # otherwise; 'cuda' fails loudly instead. Measured at 12.9 ms/frame on CPU for a 2002x1126
  # frame, against the 250 ms decision budget -- so CPU is not the constraint here, and this
  # exists for the deploy-time case where the GPU is free and the terrain classifier is not.
  device: auto
  # Where in a detection box the brawler's FEET are, as a fraction of box height up from the
  # BOTTOM edge. The bottom edge itself (0.0) is wrong and it is worth knowing why: these boxes
  # enclose the nameplate, health bar, ammo pips, sprite AND any active aura, so the bottom is
  # the bottom of the aura -- measured ~68 px, about one tile, below Mortis's feet on
  # standstill f300. Because auras come and go, the box also breathes: player box height swings
  # 264-380 px within one clip.
  #
  # MEASURED by the one accuracy test available without hand labels -- a brawler cannot stand in
  # a WALL or in WATER, and the occupancy map knows where those are. Share of frames placing the
  # player in an impossible cell, scored against each clip's fully-accumulated map:
  #
  #   anchor               0%     20%     30%     40%     50%    100%   | base rate
  #   showdown_..._map    23.7%  11.3%  11.9%  14.9%  23.8%  56.5%  |  26.5%
  #   showdown_..._map2   15.6%   6.7%   5.4%   1.1%   0.8%   4.9%  |  19.1%
  #
  # The raw bottom edge is barely better than chance (23.7% vs a 26.5% base rate). The optimum
  # is a BAND, not a point: the wall-heavy clip prefers 0.20 and degrades past 0.40, the
  # water-heavy one keeps improving to 0.50 -- they disagree because the terrain classifier's
  # own weak spot is walls, so some "impossible" cells are the map being wrong, not the anchor.
  # 0.30 is the middle and near-best on both. Still not a calibration: settling it needs frames
  # labelled with a brawler's true tile.
  anchor_frac: 0.30

projectile:               # object_detection/projectile_detection -- OUR model, over the RAW frame
  # A PATH, not a registry key, and that is the difference from detector.model above. That model
  # is fetched from a URL by name and has one correct version; this one is produced by
  # projectile_detection/train.py on whatever machine ran it, so there is no registry to name.
  #
  # Empty means the promoted default, projectile_detection/weights/projectiles.onnx. Promotion is
  # a deliberate copy rather than "newest run wins", because runs/ increments (projectiles,
  # projectiles2, ...) and a path into it would pin whichever run happened to be first. When the
  # file is missing, weights.require() lists the runs that could satisfy it, newest first, with
  # the copy command -- so leaving this blank is the normal state, not an unfinished one.
  model: ""
  # NOT MEASURED. A placeholder in the sense configs/vision.yaml uses the word, but not an
  # arbitrary one -- there are two reasons to expect it to sit below detector.conf's 0.5:
  #
  #   1. YOLO26 is NMS-FREE. It emits a fixed 300 rows per frame with no objectness score ahead
  #      of them, padded out at ~0.003 confidence, so this threshold is the ONLY thing thinning
  #      the field. For the anchor-grid entity model, objectness has already done most of that.
  #   2. The cost asymmetry runs the other way. A brawler is large and persistent, so a frame
  #      that misses one is recovered by the next; a projectile is on screen for a handful of
  #      frames, so a miss loses the whole event. Meanwhile a duplicate projectile box costs
  #      almost nothing, where a duplicate "player" box means the pipeline is broken.
  #
  # Sweep it with --projectile-conf on real footage and replace this comment with the numbers,
  # the way detector.conf's was replaced. Until then it is a guess with a rationale.
  conf: 0.30
  # auto | cpu | cuda, resolved exactly as detector.device is -- 'auto' takes CUDA when the
  # onnxruntime-gpu build is present, 'cuda' fails loudly if it is not.
  #
  # There is no `iou` key here and that is deliberate rather than an omission: YOLO26 runs no NMS
  # at all, so an overlap threshold would be a setting nothing reads. It matters for projectiles
  # specifically -- a volley of three shots along one line overlaps heavily, and NMS is exactly
  # what would have merged them into one box.
  device: auto

hp:                       # object_detection/hp_detection -- the HP number inside a detection box
  # ALL MEASURED on day10_gameplay.mp4 unless a line says otherwise. The digit templates are a
  # separate artifact and are NOT tuned here: they live in
  # object_detection/hp_detection/data/digits.npz and are regenerated by
  # scripts/vision_hp_calibrate.py, the same way the homography is.
  #
  # READ THIS BEFORE LOOSENING ANYTHING. The failure mode this whole stage is built against is
  # not a noisy number, it is a CONFIDENT WRONG one. Brawl Stars floats damage and healing
  # popups -- white, the same font, several times larger -- straight across the health readout,
  # and a covered "8400" reads as a clean, well-formed "8" scoring 0.928 with a 0.181 margin.
  # Almost every value below is part of catching that.

  # The slice of each box searched. The readout sits at the top; the digit row's top edge never
  # exceeded 0.35 of box height in the sampled crops, and 0.55 is that with room for the box
  # "breathing" 264-380 px within one clip as auras come and go.
  crop_height_frac: 0.55
  # Horizontal padding, as a fraction of box width: the bar is drawn to a width set by MAX HP and
  # overhangs the box (up to 160 px of bar against a 135 px box). The cost is pulling a
  # neighbour's readout in during a fight, which the centring test rejects.
  crop_pad_frac: 0.12

  # The HP number is WHITE. The nameplate a few pixels above it is TEAM-COLOURED (green for you,
  # salmon for an enemy) in the same font at the same size, and the saturation CEILING is the
  # only thing separating them -- this is not a generic "bright" threshold.
  white_max_sat: 70
  white_min_val: 175

  # Digit height band, in SCREEN pixels. Measured over 195 glyphs: 15:47 16:103 17:16, with a
  # thin tail at 12 and 20-24 that is popups caught mid-animation, not HP digits. The upper bound
  # is load-bearing -- it is what tells a digit from a floating damage number -- and
  # brawl_vision.config.validate refuses a value that reaches into locate.POPUP_MIN_H.
  # These are screen pixels and the HUD does not scale with the camera: re-measure at a new
  # capture resolution.
  glyph_min_height: 13
  glyph_max_height: 19

  # Confidence-ramp floors: where a glyph's NCC score / runner-up margin stops counting for
  # anything. Intact reads sit at a median NCC of 0.949 with margins of 0.15-0.20; the two bad
  # reads that survived every structural gate scored 0.418/0.054 and 0.693/0.367.
  min_glyph_score: 0.70
  min_glyph_margin: 0.03

  # Filled-bar hue per class, OpenCV 8-bit (H is 0-179, a HALF-degree wheel). Player green
  # medians 56 and enemy red medians 173 across 161 measured bars; the enemy band WRAPS past 179,
  # which is legitimate and handled -- validate deliberately does not require low <= high, the
  # same asymmetry zone.hsv_low documents. Searched only in a window under an already-found digit
  # row: a hue search over the whole box finds the map instead, because the day10 skin's bush is
  # hue 93 and its water is ~66, a hair from player green.
  bar_hue_player: [46, 66]
  # [166, 5], NOT [166, 180]: OpenCV hue tops out at 179, so 180 is not a colour -- and spelled
  # that way the band also fails to WRAP, quietly matching nothing at the red end it exists for.
  bar_hue_enemy:  [166, 5]

  # --- temporal. All in FRAMES at whatever rate the caller drives the tracker; at the 4 Hz
  # decision rate confirm_frames 2 is 500 ms of latency on a genuine HP change.
  # How many times a CHANGED value must be seen before it replaces the committed one, unless it
  # arrives above instant_confidence. Deliberately debouncing rather than a window vote: HP is
  # not constant, so voting collapses its own agreement exactly when the reading is most correct.
  confirm_frames: 2
  # Frames a track coasts on its last committed HP through unusable reads. Not 0 -- a readout
  # covered by its own damage popup belongs to a brawler whose HP is still about what it was, and
  # reporting nothing there punches a hole in the observation while the agent is being shot at.
  max_misses: 3
  # A read this confident commits with no confirmation, EXCEPT when it is a digit-truncation of
  # the value it would replace ("8400" -> "400"), which is the signature of a covered readout and
  # is never trusted on confidence alone.
  instant_confidence: 0.90
  # Per-frame confidence decay while coasting or being contradicted.
  decay: 0.75
  # Frame-to-frame association gate, as a fraction of box WIDTH. This is NOT a tracker: a Mortis
  # dash covers ~340 px between decisions at 4 Hz against a ~180 px box, and breaking there is
  # intended behaviour.
  match_distance_frac: 1.5
  # A POLICY choice, not a measurement -- it trades wrong numbers against absent ones, and which
  # is worse belongs to whoever consumes the observation.
  min_confidence: 0.50

  # --- ammo. object_detection/hp_detection/hero_bars.py, the track below the HERO's own HP bar.
  # MEASURED on bluestacks-example-new.mp4, NOT on day10_gameplay.mp4 like the rest of this
  # section -- and at that clip's own **1920x1080**, not at the 2002x1126 this file says
  # elsewhere. ClipReader trims to 16:9 and never resizes, and that clip is natively 16:9. The
  # stack scales with viewport height (measured: super track 116 px at 1080, 120 at 1126), so
  # these are 1080 numbers that happen to be right at the 1126 deployment viewport. See
  # hero_bars.py:PIP_WIDTH_PX.
  #
  # The ammo and super tracks sit BELOW the HP bar, so this stage needs a taller slice than
  # crop_height_frac gives it: the super track's last row was at 0.68 of box height in the
  # sampled crops. Separate from crop_height_frac rather than raising it, because a taller crop
  # for the DIGIT search means more chances to pull in a neighbour's readout.
  ammo_crop_height_frac: 0.75
  # A filled pip's orange. Narrow on purpose -- the map's crate borders are also orange, and this
  # band is not what rejects them; the pitch lattice in slot_fills is. See that docstring.
  ammo_hue: [2, 18]
  ammo_sat_min: 110
  ammo_val_min: 130
  # One pip's painted width, in viewport pixels -- the DENOMINATOR, since the three pips are
  # identical and there is no recoverable track extent to divide by three. Mode of 353 runs (34,
  # with 33 and 35 as its shoulders); mean 34.33, sd 0.66 over 144 frames showing all three.
  # A full pip therefore reads 0.94-1.03 and that residual is reported, not snapped away.
  # Re-measure at a new capture resolution: this is screen pixels, like the glyph heights above.
  ammo_pip_px: 34

  # --- super charge (hp_detection/hero_bars.read_super). One track below the ammo pips, and
  # unlike ammo it is SELF-NORMALIZING: the empty remainder is painted in its own colour, so the
  # denominator is the track's own extent rather than a calibrated constant.
  #
  # MEASURED on bluestacks-example-new.mp4 over 181 located frames, each colour sampled from a run
  # identified by structure rather than by these thresholds: 3890 filled px, 6494 ready px, 1720
  # empty px. Filled hue 26-29 / sat 114-197 / val 219-255.
  super_hue: [20, 35]
  super_sat_min: 100
  super_val_min: 180
  # Ready: hue 162-166 at saturation EXACTLY 255 in every percentile p5..p95, val 189-234. A THIRD
  # STATE, not "all yellow" -- at full charge the whole widget turns magenta, so a reader that
  # counts yellow and divides reports 0.0 charge at the moment the super becomes available.
  super_ready_hue: [155, 172]
  super_ready_sat_min: 230
  super_ready_val_min: 160
  # Empty: hue 124-133, sat 102-143, val 74-99. Narrow deliberately. A first pass used sat >= 80
  # with val 60-140 and that mask ate the map behind the widget, returning tracks of 110-225 px
  # for a 116 px widget and deflating every charge reading in proportion. This map is made of dark
  # blue-purple; only the tight value band separates the widget from it.
  super_empty_hue: [117, 137]
  super_empty_sat: [90, 165]
  super_empty_val: [62, 118]
  # The track's full width at the calibrated viewport and the tolerance around it. A SANITY GATE,
  # never a denominator -- the reading divides by the extent the frame itself found. Measured as
  # the median of 171 successful reads: p10 114, p50 116, p90 118, min 104, max 128, sd 2.6.
  super_track_px: 116
  super_track_tol_px: 22

hud:                      # hud.py -- screen-anchored readouts. "Brawlers left: N", so far.
  # This section has three keys because everything else about the widget is GEOMETRY, and
  # geometry lives in hud.py as reference pixels at a 1126 px viewport, measured across six clips
  # at two resolutions. The same rule configs/vision.yaml applies elsewhere: a setting is a thing
  # a user might reasonably want different, and "where Supercell draws the colon" is not that.
  #
  # NOT here, and deliberately: the white threshold. hud.py reads hp.white_max_sat and
  # hp.white_min_val, because the count is the same font in the same white as an HP digit --
  # measured at saturation 2-5, value 203-255, comfortably inside (S<70, V>175). A near-duplicate
  # pair here would be two knobs that must agree.
  #
  # How many brawlers the mode fields, and so the largest count that can be real. Solo Showdown
  # is 10. A read outside 1..10 is a mis-segmentation, not a surprising match.
  max_brawlers: 10
  # Glyph floors for the count. A BACKSTOP -- what actually rejects the white map pixels a
  # screen-space band admits is structural: a colon at the measured x, a bounded gap from it to
  # the first digit, and a shared row. An ungated pass had a score p05 of 0.308, which was map
  # blobs classifying as digits. MEASURED after the gates, over 4538 accepted reads across ten
  # clips: score p05 0.893-0.930 per clip, global min 0.758; margin p05 0.160-0.229, min 0.152.
  # A solid 19x41 white rectangle still reads as a `1` at 0.753/0.076 -- raising these to cover
  # that would put them above real reads, which is why the structural gates are the defence.
  min_glyph_score: 0.70
  min_glyph_margin: 0.05
