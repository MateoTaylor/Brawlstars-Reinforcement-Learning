# PPO training configuration -- the single file you edit to tune a run.
#
# Loaded by brawl_sim/training/config.py (`load_train_config`), consumed by scripts/train.py.
# Deliberately separate from configs/default.yaml: that file describes the SIMULATOR (map size,
# episode length, bot toggles -- what the world is), this one describes the RUN (PPO
# hyperparameters, reward shaping, the difficulty curriculum -- how the agent learns in it).
# Nothing here reaches EnvConfig/SimParams except via `run.env_overrides` and `curriculum`.
#
# Override any single key from the CLI without editing this file:
#   python scripts/train.py --set ppo.n_steps=256 --set learning_rate.initial=1e-4

# ---------------------------------------------------------------------------------------------
# UNITS. configs/default.yaml sets `sim.action_repeat: 5`, so one SB3 timestep is one AGENT
# DECISION = 5 sim ticks = 0.25 s of game time, and every "timesteps"/"steps" number in THIS file
# is in decisions. The one exception is `sim.max_episode_steps` (3700 in `env_overrides` below),
# which stays in SIM TICKS: an episode here is at most 740 decisions. See default.yaml's
# `sim.action_repeat` comment.
# ---------------------------------------------------------------------------------------------

run:
  name: mortis_ppo              # run directory name; a timestamp suffix is added unless --no-stamp
  seed: 0
  device: cuda                  # cuda | cpu
  out_dir: runs                 # runs/<name>/{best,checkpoints,tb,train.yaml,curriculum.json}
  total_timesteps: 600_000_000   # decisions (3.0B sim ticks); the user's budget, see curriculum
  n_envs: 4096                   # SB3 boundary cost grows with this
  algo: maskable_ppo            # maskable_ppo (uses action_masks) | ppo

  env_config: configs/default.yaml
  # The deployable spec, and the default: agent_obs_deploy5.yaml is deploy4 plus `hero.near_edge`
  # and tracked-slot enemy rows, and brawl_deployment supplies every field of it. The older specs
  # stay loadable, because every run's train.yaml names its spec by path:
  #   --set run.agent_obs=configs/agent_obs.yaml           <- full information; cannot deploy
  #   --set run.agent_obs=configs/agent_obs_lowinfo.yaml   <- full, minus kind and weapon type
  #   --set run.agent_obs=configs/agent_obs_deploy.yaml    <- the first deployable spec
  #   --set run.agent_obs=configs/agent_obs_deploy2.yaml   <- deploy, zone group rebuilt
  #   --set run.agent_obs=configs/agent_obs_deploy3.yaml   <- deploy2 plus crates and cubes
  #   --set run.agent_obs=configs/agent_obs_deploy4.yaml   <- deploy3 plus gadget and history
  # deploy and deploy2 cannot see cubes, so they also need `--set reward.cube_pickup=0` (below).
  # Each is a different observation width, so none of them is a checkpoint swap.
  agent_obs: configs/agent_obs_deploy5.yaml
  # Per-env jitter, redrawn at every reset and applied on top of (and independently of) the
  # curriculum below. The shipped file jitters only the gas schedule, +/-10 % around the values in
  # `env_overrides`, as part of the user's gas pace (see below). Evaluation never applies it:
  # TierEvaluator builds its env without it, so eval/ scores are at the nominal schedule. null
  # turns it off.
  randomization: configs/randomization.yaml
  # Nested dict deep-merged onto env_config, e.g.
  #   entities: {n_enemies: 6}
  #   sim: {max_episode_steps: 3000}
  env_overrides:
    observation:
      # No agent_obs spec reads the full-map grid: obs_select indexes `full_obs["view"]` and never
      # `full_obs["world"]`, yet build_obs would rasterize the 60x60x12 world grid twice per step
      # (in _observe and in _autoreset) and throw both away. Off for TRAINING only: default.yaml
      # leaves it on for the tools that draw the whole map (render/viewer.py, scripts/watch.py,
      # scripts/record_rollout.py). Turn it back on here if an agent_obs group consumes `world`.
      include_world_grid: false
      # Same for the two raw line-of-sight fields (visibility.los, entities.los_from_hero): no
      # agent_obs group reads them, and each obs build would pay a full wall march over every
      # entity pair for them. Turn back on here if an agent_obs group ever consumes them.
      include_raw_los: false
      # USER SETTING, 2026-10-07 ("#32: go with option C", BRAWL_SIM_DESIGN.md §2). A projectile
      # slower than 2.0 tiles/s reads as still, `vel` 0 and `time_to_closest` 0, which is how
      # the live tracker reports it (STATIC_TILES_S; a test pins the two equal). Grom's shell
      # lands 1.25 s after the throw, so a short lob crawled, and its time_to_closest, unscaled,
      # could read hundreds of seconds. On screen it now stays under the farthest visible
      # point over 2 tiles/s (9.2 s mid-map), as it does live.
      projectile_static_speed: 2.0
    world:
      # THE TRAINING ROTATION: default.yaml's thirty-six maps minus the two in
      # `eval.holdout_maps` below. A list in an override REPLACES the base list, it is not merged
      # into it, so this is the whole rotation: a map added to default.yaml does not train until
      # it is also added here. default.yaml keeps all thirty-six because it is the SIM's list
      # (tests/test_maps.py, the tools). `python scripts/train.py` refuses to start if a holdout
      # map is also in this list. Everything under `eval/` except `eval/holdout_*` is measured on
      # exactly these thirty-four, so eval/holdout_* is the line comparable across map pools.
      maps: [open, bushy, skull_creek, feast_or_famine, scorched_stone, island_invasion,
             broken_wall, stone_fort, twin_ponds, cross_creek, narrow_pass,
             dry_gulch, thorn_field, reed_marsh,
             hot_maze, ghost_point, shadow_spirits, crescent_lakes, twisting_vines,
             pond_maze, canal_maze, picket_maze, lagoon_ring, square_lakes, bush_halo,
             bramble_ponds, bramble_bend, bramble_stars, moon_gate, half_moon, moon_pools,
             vine_springs, vine_canal, vine_hollow]
    # THE GAS SCHEDULE AND THE EPISODE LENGTH -- USER SETTING: about 1.3x the real game's gas pace,
    # in an episode a little shorter than a real match. Measured from footage, the game's first
    # gas comes 19 s after the match gate, then closes one tile per side every 6-7 s and reaches
    # 2x2 at about 200 s. Here: 5.0 s per tile in a 185 s episode, where default.yaml's
    # `start_fraction 0.08` puts the first gas at 14.8 s (19 / 1.3 = 14.6), with
    # randomization.yaml's +/-10 % on both (BRAWL_SIM_DESIGN.md §8).
    #
    # The episode length lives HERE, never in default.yaml: runs name default.yaml by path, and
    # brawl_deployment/policy.py rebuilds the live `time_frac` denominator from it plus the run's
    # own overrides, so editing the default would silently stretch the live 150 s of every run
    # trained without this override. A run started from this file records its 185 s in its own
    # train.yaml. Keep it a multiple of action_repeat (5).
    sim:
      max_episode_steps: 3700     # sim ticks: 185 s, 740 decisions
    zone:
      step_seconds: 5.0
    # USER SETTING: the auto-aimed attack (attack value 4). The policy may dash straight at the
    # nearest enemy or crate in reach without aiming, in or out of view, or keep aiming along
    # the move bin with value 1. Structural (a 5-wide attack column), so it lives here and a
    # run trained without it keeps default.yaml's `false` in its own frozen train.yaml.
    action:
      auto_aim: true
    # USER SETTINGS, 2026-10-06 (SIM_ISSUES_PLAN.md, from the issues seen in watch.py). Every
    # key below keeps the old sim at its default.yaml value, so earlier runs replay unchanged.
    #
    # Crates: a dash hits each crate once, as it does each unit, and 8000 HP (the real game's
    # 4500-8500) takes Mortis 4 dashes at 0-3 cubes, 3 at 4-9 and 2 from 10. Before, a crate
    # took a hit on every tick of a dash, so one dash broke a 3000-HP crate.
    boxes:
      hp: 8000
      dash_hits_once: true
    # The game's own cube cap, 99 (Brawl Stars, 2019-09), which no match reaches: the supply is
    # one cube per crate plus one per death. default.yaml's 16 left a capped hero circling cubes
    # it could not take, with nothing in the observation to say why.
    cubes:
      max_cubes: 99
    # Bots (the user's 2026-10-06 answers to SIM_ISSUES_PLAN.md §7):
    #   nav: "bots should get as real pathfinding as possible without compromising training time
    #     seriously". A shortest walkable path to the enemy, bush or waypoint, out of the gas and
    #     away when backing off; a kiter with no line of sight closes, and one whose strafe meets
    #     a wall turns round (2026-10-07). These keys together (boxes, cubes, bots, and the
    #     reward's move_reversal) cost +9.9 % per env step on CUDA at 4096 envs (311 -> 342 ms on
    #     an idle machine), part of it the harder game's extra episode resets (SIM_ISSUES_PLAN.md §B).
    #   endgame_players: "campers should switch to hunting in final 4" (the hero counts).
    #   tap_aim: the game's bots attack with a tap, whose auto-aim fires at the target's current
    #     position and never leads, so a LEAD/LOB bot aims there (the tier aim noise still applies).
    #   lead_velocity_tau: "smoothed bot velocity should be solid". A bot reads its target's
    #     velocity through a 0.25 s low-pass, one decision period. With tap_aim on, nothing leads,
    #     so it only steadies Shelly's hold-fire on a fast crosser.
    bots:
      nav: true
      endgame_players: 4
      tap_aim: true
      lead_velocity_tau: 0.25

  info_mode: episode           # minimal | episode | full. "episode" is the MINIMUM the
                                # curriculum needs -- it is what carries info["outcome"].
  checkpoint_every_steps: 10_000_000   # decisions; 0 disables periodic checkpoints.
                                       # best_model.zip (eval callback) and the LR/clip
                                       # schedules (function of total_timesteps) do not
                                       # depend on this value.
  tensorboard: true
  log_interval: 1               # rollouts between SB3 logger dumps
  verbose: 1

ppo:
  n_steps: 128                   # per env, in DECISIONS. USER SETTING, with gae_lambda: the
                                 # policy must plan a whole 740-decision match, so neither is
                                 # lowered for speed.
  batch_size: 8192               # must divide n_steps * n_envs
  n_epochs: 6
  gamma: 0.998                 # PER DECISION. Horizon 1/(1-0.998) = 500 decisions (125 s)
  gae_lambda: 0.98               # USER SETTING, see n_steps
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.025               # SB3 stops a rollout's epochs once approx KL passes 1.5x this
  normalize_advantage: true

# Both schedules are functions of SB3's `progress_remaining` (1.0 at the first step -> 0.0 at
# total_timesteps). schedule: constant | linear | cosine | exponential. The floors (LR 5e-5,
# clip 0.1) are the user's.
learning_rate:
  schedule: linear
  initial: 2.0e-4
  final: 5.0e-5

clip_range:
  schedule: linear
  initial: 0.2
  final: 0.1

policy:
  cnn_output_dim: 160           # BrawlFeaturesExtractor: conv stack over the uint8 grid group
  mlp_hidden_dims: [256, 256]   # BrawlFeaturesExtractor: stacked MLP over every float32 group
  net_arch:                     # policy/value heads on top of the extractor
    pi: [384, 384]
    vf: [384, 384]

# VecNormalize. Observation normalization is OFF by default because every configs/agent_obs*.yaml
# already sets `normalize: true` (obs_select scales fields into sane ranges on-device, before
# the host transfer). Reward normalization is ON: shaped-reward magnitudes shift every time the
# curriculum advances, and a running return-scale keeps PPO's value loss well conditioned.
normalize:
  obs: false
  reward: true
  clip_obs: 10.0
  clip_reward: 10.0

# ShapedReward (brawl_sim/training/reward.py). Per-tick terms are in RAW sim units: damage comes
# in hits of ~1000-2000, hence weights around 1e-4. Set any weight to 0.0 to disable that term.
reward:
  # --- terminal (fires once, on the tick the episode ends) ---
  win_bonus: 10.0               # hero was the last one alive
  death_penalty: -3.0           # hero died (combat or zone)
  rank_bonus: 0.5                # x places above last: 0 for 10th, 4.5 for 1st at n_enemies 9
  # --- per tick ---
  damage_dealt: 3.0e-4          # x hero damage dealt: a landed 2000 hit pays 0.6
  damage_taken: -1.0e-4         # x hero damage taken this tick (combat only; zone is below)
  hp_healed: 1.0e-4             # x hero HP restored this tick (regen + super lifesteal); the
                                # mirror of damage_taken, so healing a wound off refunds what
                                # taking it cost. Capped by max HP, so it cannot be farmed.
  kill: 3.0                     # x enemies the hero killed this tick
  # Only pay for what the agent can see. A spec with no `pickup` channel and no `pickups.*` field
  # cannot see the thing this term pays for, and paying for it anyway trains an approach
  # behaviour that cannot transfer -- silently: the run looks fine and the deployment
  # underperforms for a reason nothing reports.
  #
  # This is a SHARED file and the specs differ, so the pairing is enforced per RUN, where the two
  # meet: brawl_sim/training/builder.check_reward_is_observable refuses to build a run that pays
  # this term under a spec that cannot see pickups. Retraining on agent_obs_deploy.yaml or
  # agent_obs_deploy2.yaml therefore needs `--set reward.cube_pickup=0`, and the error says so.
  # 0.7 because the early game is where cubes are built, and the hero's win rate climbs steeply
  # with the cubes it holds (BRAWL_SIM_DESIGN.md §10). Cubes are conserved, so the term is bounded
  # by what is on the map: one per crate (24 on average) plus what kills drop.
  cube_pickup: 0.7              # x power cubes the hero collected this tick -- see above
  survive_per_step: 0.0       # flat, every tick the hero is alive
  in_zone_per_step: -0.05       # flat, every tick the hero is outside the safe rect
  # USER DECISION (BRAWL_SIM_DESIGN.md §10). x attacks and supers the hero made while an enemy it
  # can see stood inside its uncharged dash reach (2.67 + 0.70 + 0.40 = 3.77 tiles), at most one
  # per decision. Small on purpose: a twelfth of the 0.6 a landed 2000 hit pays, 1/60 of a kill,
  # and about 3 over a whole episode of attacking in reach, against 10 for a win. It also pays a
  # dash away from that enemy, and a miss; 0 turns it off.
  attack_in_reach: 0.05
  # USER DECISION (BRAWL_SIM_DESIGN.md §10). x landings of the hero's gadget spinner that hurt at
  # least one player: one per landing however many it catches, none for a spinner that lands only
  # on crates or on nothing. Paid on top of damage_dealt (0.6 for a base 2000 hit). The 18 s
  # cooldown allows about ten throws a match, so about 3 at most, against 10 for a win.
  gadget_hit: 0.3
  # USER DECISION 2026-10-07 (SIM_ISSUES_PLAN.md §5.2). x decisions whose move bin swung >= 135
  # degrees from the last one's, both non-idle. The old policy reversed on 26 % of its decisions
  # (measured), about 1.2 a 120 s match at this weight; a dodge that saves one 1300-HP hit is
  # worth 0.13 in damage_taken, so a real dodge still pays and jitter with nobody shooting stops
  # paying. Counts decisions, not ticks, so a different action_repeat changes its price; 0 is off.
  move_reversal: -0.01
  scale: 1.0                    # multiplies the whole sum; a global volume knob

# Stationary evaluation. Periodically plays a small, FIXED set of matches against each difficulty
# tier below, with the curriculum's sampling switched off and the same seed every time -- so the
# scenarios, maps, and bots are identical at every eval.
#
# This is the only signal in the run comparable across time. `rollout/ep_rew_mean` is measured
# against the training distribution, which the curriculum deliberately makes harder, so it cannot
# tell "policy improved" apart from "curriculum got easier". These can.
#
# Logged as `eval/win_rate_<tier>` (also columns in logs/progress.csv) AND as one overlaid
# TensorBoard chart, `eval/win_rate`, with a line per tier (written to logs/eval_<tier>/).
# `best_model.zip` is saved whenever the mean win rate across tiers improves.
#
# Cost PER EVALUATOR, and with `eval.holdout_maps` set (it is, below) there are TWO: one rollout
# of `len(tiers) * episodes_per_tier` envs (6 x 300 = 1800), ALL RUN IN PARALLEL and bounded by
# cfg.max_agent_steps (740) decisions, so raising episodes_per_tier widens the batch rather than
# adding sequential rounds. Each eval env is built ONCE and held in VRAM for the whole run
# (TierEvaluator is eager, not rebuilt per eval): a permanent memory cost, not just a slower
# periodic eval. At n=300/tier the win-rate standard error is at most ~2.9 pp.
#
# `every_timesteps` counts SB3 timesteps, which advance by n_envs (4096) per decision, so 20M of
# them is ~4,900 decisions of each training env: ~31 evals over the 600M run, at_start included.
eval:
  enabled: true
  every_timesteps: 20_000_000      # decisions. An eval is TWO rollouts, training maps then
                                  # holdout_maps below; each ends when its longest first
                                  # episode does, at most cfg.max_agent_steps (740) decisions.
  episodes_per_tier: 300
  tiers: []                     # empty = every tier under curriculum.tiers below
  deterministic: true           # argmax actions; lower variance, the usual choice for eval
  seed: 999983                  # unrelated to run.seed, so eval scenarios are not training ones
  at_start: true                # one eval before training starts, as the baseline
  # MAP-OVERFITTING EVAL. Maps the run NEVER trains on: they are absent from
  # `run.env_overrides.world.maps` above, and the config is refused if one is not.
  # One standard point-symmetric map and one water_border map (families: brawl_sim/maps/README.md).
  # A second evaluator, identical to the first (same tiers, episodes_per_tier, seed, pinned bots)
  # except that its map bank holds ONLY these, runs right after it at every eval and logs
  #   eval/holdout_win_rate_<tier>, eval/holdout_win_rate (mean over tiers; mirrors
  #   eval/win_rate_mean), eval/holdout_gap (= win_rate_mean - holdout_win_rate),
  #   and tag eval/holdout_win_rate in each logs/eval_<tier>/ (one overlaid chart, a line per tier
  #   PLUS the run's own line on the same tag, which is the mean; eval/win_rate's mean is the
  #   separate eval/win_rate_mean chart).
  # Read the gap's TREND from the at_start row onward, not its sign: two maps are not exactly as
  # hard as the other thirty-four, so an untrained policy already shows a small non-zero gap. A gap
  # that widens while eval/win_rate_mean climbs is the policy memorizing maps.
  # `best_model.zip` is picked on the TRAINING-map mean alone -- choosing the checkpoint by its
  # holdout score would fit the choice to these two maps and spend the holdout.
  # COST: eval wall-clock doubles, and a second eval env of the same size is held in VRAM for the
  # whole run. Set to [] or null to switch the holdout eval off; a `--set run.env_overrides=...`
  # that changes world.maps must keep these two out of it.
  holdout_maps: [split_river, hollow_ring]

# ---------------------------------------------------------------------------------------------
# Difficulty curriculum.
#
# A "tier" is a set of MULTIPLIERS applied to configs/brawlers.yaml's own per-archetype numbers,
# so tier `hard` (all 1.0) is exactly the bots as authored there. Tiers are sampled per
# (env, archetype) on every reset, from the current stage's `tier_weights` -- so within one
# batch you face the advertised mixture, and within one episode different archetypes can sit at
# different tiers. Archetype SELECTION stays random throughout (entities.randomize_enemy_types
# and enemy_type_weights in configs/default.yaml); the curriculum changes how well those bots
# play, not which ones show up.
#
# Advancement is adaptive: the win rate over the last `window_episodes` finished episodes must
# reach a stage's `advance_win_rate` (with at least `min_episodes_at_stage` episodes played at
# that stage) before it advances. The final stage has advance_win_rate: null and is terminal.
# Only episodes whose bots were drawn from the CURRENT stage count. The episodes in flight when a
# stage changes finish afterwards with the previous stage's bots, and are skipped.
#
# USER SETTINGS: gates 0.15 at every stage, window and minimum 2000/2000, demotion off, a 125M cap
# per stage and a 600M run (run.total_timesteps). A stage that misses its gate is force-advanced
# at the cap, so the run reaches elite by 500M at the latest (BRAWL_SIM_DESIGN.md §11).
curriculum:
  enabled: true
  window_episodes: 2000         # rolling window the win rate is measured over (SE ~0.8 pp at 0.15)
  min_episodes_at_stage: 2000   # floor before a stage may advance; must not exceed the window
  demote_win_rate: null         # keep null: the first episodes to finish at a new stage are the
                                # short ones, i.e. early deaths, so a fresh window starts low
  max_timesteps_at_stage: 125_000_000   # force-advance a stalled stage, so the run always reaches
                                       # elite: worst case it gets there at 500M of 600M

  # Multipliers on the brawlers.yaml base value, applied to bot kinds only (never the hero).
  #   aim_noise       x aim_noise_std_rad and aim_noise_tiles  (HIGHER = worse aim)
  #   reaction_delay  x reaction_delay                         (HIGHER = slower to react)
  #   lead_target     x lead_target_fraction, clamped to [0,1] (LOWER  = worse at leading shots)
  #   decision_period x decision_period_ticks, rounded, >= 1   (HIGHER = re-decides less often)
  #   move_speed      x move_speed
  #   hp              x base_hp
  #   damage          x base_damage
  #   aggression      x aggression (> 0; base 1.0 on all bots) (HIGHER = retreats at lower HP, a
  #                                                             KITE holds closer, a CAMPER fires
  #                                                             on sight from 1.25 up)
  #   hero_focus      x hero_focus (base 0.5), clamped to [0,1] (HIGHER = prefers the hero: he is
  #                                                             the target when his distance x
  #                                                             (1-focus) beats the nearest bot's)
  #
  # Listed weakest to strongest (tests/test_training.py holds every knob to that order).
  # USER RULE: HP and damage cap at 1.5x (elite), and what separates the tiers is accuracy,
  # aggression and how hard the bots favor the hero (BRAWL_SIM_DESIGN.md §11). Below hard those
  # fall faster than HP/damage (an easy bot is a bad shot that runs away, not a paper bot); above
  # hard they keep climbing while HP/damage plateau. `easy` is in no stage and is kept only as the
  # bottom yardstick; its aim_noise 2.5 is the user's own. `move_speed` stays 1.0 above hard on
  # purpose: Mortis (2.73 tiles/s) is only 6-14% faster than most ranged bots (2.40-2.57; Bull is
  # 2.17) and Edgar matches him, so a faster bot could kite him forever. That would make a matchup
  # unwinnable rather than hard.
  #
  # The elite `hp: 1.5` takes the largest possible normalized `entities.hp` (a 10000-HP Bull or
  # Buzz at default.yaml's 16 cubes: 10000 x 1.5 + 16 x 400 = 21400) to 1.07, just past the 1.0
  # that obs_select's _NORM_HP_SCALE (20000) aims for. This file's 99-cube cap lifts the bound to
  # 2.73, though the supply keeps matches far below it (a 2026-10-07 smoke's peak, 42 cubes,
  # caps it at 1.59). Nothing clips the value.
  tiers:
    easy:
      aim_noise: 2.5
      reaction_delay: 2.2
      lead_target: 0.25
      decision_period: 2.0
      move_speed: 0.90
      hp: 0.75
      damage: 0.70
      aggression: 0.6           # HUNTER/KITE retreat below 58% HP (0.35 / 0.6), not 35%
      hero_focus: 0.0           # -> 0.00: no preference, the hero is just another target
    medium:
      aim_noise: 1.8
      reaction_delay: 1.6
      lead_target: 0.60
      decision_period: 1.5
      move_speed: 0.95
      hp: 0.90
      damage: 0.85
      aggression: 0.8
      hero_focus: 0.4           # -> 0.20
    hard:                       # brawlers.yaml exactly as authored -- the reference bot
      aim_noise: 1.0
      reaction_delay: 1.0
      lead_target: 1.0
      decision_period: 1.0
      move_speed: 1.0
      hp: 1.0
      damage: 1.0
      aggression: 1.0
      hero_focus: 1.0           # -> 0.50: the hero at 7 tiles beats a bot at 4
    veteran:
      aim_noise: 0.6
      reaction_delay: 0.6
      lead_target: 1.0
      decision_period: 1.0
      move_speed: 1.0
      hp: 1.15
      damage: 1.15
      aggression: 1.2
      hero_focus: 1.3           # -> 0.65
    expert:
      aim_noise: 0.4
      reaction_delay: 0.45
      lead_target: 1.25
      decision_period: 0.75     # 4-tick deciders re-decide every 3; 2-tick ones stay at 2
      move_speed: 1.0
      hp: 1.30
      damage: 1.30
      aggression: 1.4           # past 1.25: an unseen CAMPER fires on sight from here up
      hero_focus: 1.5           # -> 0.75
    elite:                      # the user's cap: 1.5x health and damage, the rest is skill
      aim_noise: 0.20           # Brock's rocket bearing sd 0.06 -> 0.012 rad (0.7 deg)
      reaction_delay: 0.30
      lead_target: 1.5          # clamps at 1.0, so all leading bots but Grom (0.9) lead fully
      decision_period: 0.5      # re-decides twice as often
      move_speed: 1.0
      hp: 1.50
      damage: 1.50
      aggression: 1.7           # retreats below 21% HP (0.35 / 1.7)
      hero_focus: 1.7           # -> 0.85: the hero at 13 tiles still beats a bot at 2

  # Walked in order. `tier_weights` need not sum to 1 -- they are normalized. Each stage's mixture
  # is at least as strong as the one before it at every tier boundary, which the tests check.
  stages:
    - name: hard_intro
      tier_weights: {medium: 0.3, hard: 0.7}
      advance_win_rate: 0.15
    - name: veteran_intro
      tier_weights: {hard: 0.6, veteran: 0.4}
      advance_win_rate: 0.15
    - name: veteran
      tier_weights: {hard: 0.3, veteran: 0.5, expert: 0.2}
      advance_win_rate: 0.15
    - name: expert
      tier_weights: {hard: 0.1, veteran: 0.3, expert: 0.4, elite: 0.2}
      advance_win_rate: 0.15
    - name: elite               # terminal; keeps 10% hard against overfitting to the top tiers
      tier_weights: {hard: 0.1, veteran: 0.15, expert: 0.25, elite: 0.5}
      advance_win_rate: null
