# PPO training configuration -- the single file you edit to tune a run.
#
# Loaded by brawl_sim/training/config.py (`load_train_config`), consumed by scripts/train.py.
# Deliberately separate from configs/default.yaml: that file describes the SIMULATOR (map size,
# episode length, bot toggles -- what the world is), this one describes the RUN (PPO
# hyperparameters, reward shaping, the difficulty curriculum -- how the agent learns in it).
# Nothing here reaches EnvConfig/SimParams except via `run.env_overrides` and `curriculum`.
#
# Override any single key from the CLI without editing this file:
#   python scripts/train.py --set ppo.n_steps=256 --set learning_rate.initial=1e-4

# ---------------------------------------------------------------------------------------------
# UNITS. Since configs/default.yaml sets `sim.action_repeat: 5`, one SB3 timestep is one AGENT
# DECISION = 5 sim ticks = 0.25s of game time. Every "timesteps"/"steps" number in THIS file is
# therefore in decisions, and every one of them was divided by 5 when action_repeat went 1 -> 5
# so the run covers the same amount of simulated game time as before. `sim.max_episode_steps`
# (3700 in `env_overrides` below; 3000 in default.yaml) stays in SIM TICKS and is the one number
# that is NOT in this unit -- an episode here is at most 740 decisions long. See
# configs/default.yaml's `sim.action_repeat` comment.
# ---------------------------------------------------------------------------------------------

run:
  name: mortis_ppo              # run directory name; a timestamp suffix is added unless --no-stamp
  seed: 0
  device: cuda                  # cuda | cpu
  out_dir: runs                 # runs/<name>/{best,checkpoints,tb,train.yaml,curriculum.json}
  total_timesteps: 600_000_000   # decisions; = 300M sim ticks, the pre-action_repeat budget
  n_envs: 4096                   # SB3 boundary cost grows with this; 128-1024 is the sane band
  algo: maskable_ppo            # maskable_ppo (uses action_masks) | ppo

  env_config: configs/default.yaml
  # The deployable spec is the DEFAULT since SIM_OVERHAUL_PLAN.md Step I2 (2026-09-21). Before
  # that, full information was the default and every deploy spec was picked with --set; the next
  # run is the one meant to deploy, so a bare `python scripts/train.py` now trains it.
  # agent_obs_deploy4.yaml is deploy3 plus the gadget pair, the `history` group and three
  # `enemy_hist` grid planes, and brawl_deployment supplies every field of it (Step H4).
  # The others, by --set:
  #   --set run.agent_obs=configs/agent_obs.yaml           <- full information; cannot deploy
  #   --set run.agent_obs=configs/agent_obs_deploy3.yaml   <- the 2026-09-11 run's spec
  #   --set run.agent_obs=configs/agent_obs_deploy2.yaml   <- the zone rebuild, never trained
  #   --set run.agent_obs=configs/agent_obs_deploy.yaml    <- kept so the 2026-09-07 Mortis run
  #                                                           (the deployed one) reproduces
  # deploy and deploy2 cannot see cubes, so they also need `--set reward.cube_pickup=0` (below).
  # Each is a different observation width, so none of them is a checkpoint swap.
  agent_obs: configs/agent_obs_deploy5.yaml
  # Per-env jitter, redrawn at every reset and applied on top of (and independently of) the
  # curriculum below. The shipped file jitters only the gas schedule, +/-10 % around the values in
  # `env_overrides` (OBS_PARITY_PLAN.md section 4). Evaluation never applies it: TierEvaluator
  # builds its env without it, so eval/ scores are at the nominal schedule. null turns it off.
  randomization: configs/randomization.yaml
  # Nested dict deep-merged onto env_config, e.g.
  #   entities: {n_enemies: 6}
  #   sim: {max_episode_steps: 3000}
  env_overrides:
    observation:
      # The agent PROVABLY cannot see the full-map grid: configs/agent_obs.yaml's only grid group
      # is `view_channels` (egocentric), and brawl_sim/core/obs_select.py indexes `full_obs["view"]`
      # and never `full_obs["world"]`. But build_obs rasterizes the 60x60x12 world grid TWICE per
      # step anyway -- once in _observe, once in _autoreset -- and then throws both away.
      #
      # Measured at n_envs=1024 on an idle GPU (min of 5, identical reset per measurement):
      # 188.35 -> 178.85 ms/step, i.e. 9.5 ms/step (5.0%), plus 73 MB less peak VRAM. The VRAM
      # saving scales with n_envs, so at this file's n_envs: 4096 it is roughly 290 MB.
      #
      # Left ON in configs/default.yaml, so every tool that genuinely wants the whole map
      # (render/viewer.py, scripts/watch.py, scripts/record_rollout.py) is unaffected -- this
      # override is scoped to TRAINING, where nothing reads it. Turn it back on here if you add an
      # agent_obs group that consumes `world`.
      include_world_grid: false
    world:
      # THE TRAINING ROTATION: configs/default.yaml's sixteen maps minus the two in
      # `eval.holdout_maps` below (SIM_OVERHAUL_PLAN.md Step M4, 2026-09-18). A list in an
      # override REPLACES the base list, it is not merged into it, so this is the whole rotation:
      # a map added to default.yaml does not train until it is also added here.
      # default.yaml keeps all sixteen because it is the SIM's list (tests/test_maps.py, the tools);
      # only what a run trains on is decided here. `python scripts/train.py` refuses to start if a
      # holdout map is also in this list. Everything under `eval/` except `eval/holdout_*` is
      # measured on exactly these fourteen.
      maps: [open, bushy, skull_creek, feast_or_famine, scorched_stone, island_invasion,
             broken_wall, stone_fort, twin_ponds, cross_creek, narrow_pass,
             dry_gulch, thorn_field, reed_marsh]
    # THE GAS SCHEDULE AND THE EPISODE LENGTH (OBS_PARITY_TASKS.md pending decision 3, the lead's
    # call 2026-09-25). Measured from footage (Z1): the game's first gas comes 19 s after the
    # match starts, then advances one tile per side every ~6.5 s and reaches 2x2 at about 200 s.
    # default.yaml's 12 s and 1.5 s per tile close the map 4.4x too fast. This run trains at 1.3x
    # the game's pace, a little shorter than a real match: 5.0 s per tile in a 185 s episode, where
    # default.yaml's `start_fraction 0.08` puts the first gas at 14.8 s (19 / 1.3 = 14.6).
    #
    # The episode length lives HERE, never in default.yaml: runs name default.yaml by path and
    # brawl_deployment/policy.py rebuilds the live `time_frac` denominator from it plus the run's
    # own overrides, so editing the default would silently stretch deploy4's and deploy5's live
    # 150 s. A run started from this file records its 185 s in its own train.yaml. Keep it a
    # multiple of action_repeat (5).
    sim:
      max_episode_steps: 3700     # sim ticks: 185 s, 740 decisions
    zone:
      step_seconds: 5.0
    # The auto-aimed attack (attack value 4, 2026-09-26): the policy may dash straight at the
    # nearest enemy or crate in reach without aiming, in or out of view, or keep aiming along
    # the move bin with value 1. Structural (a 5-wide attack column), so it lives here and a
    # run trained before it keeps default.yaml's `false` in its own frozen train.yaml.
    action:
      auto_aim: true

  info_mode: episode            # minimal | episode | full. "episode" is the MINIMUM the
                                # curriculum needs -- it is what carries info["outcome"].
  checkpoint_every_steps: 10_000_000   # decisions; 0 disables periodic checkpoints. 1/20th the
                                       # save frequency of the old 200k -- best_model.zip (eval
                                       # callback) and the LR/clip schedules (function of
                                       # total_timesteps) are unaffected by this value.
  tensorboard: true
  log_interval: 1               # rollouts between SB3 logger dumps
  verbose: 1

ppo:
  n_steps: 128                   # per env, in DECISIONS;
  batch_size: 8192               # must divide n_steps * n_envs
  n_epochs: 6
  gamma: 0.998                 # PER DECISION. Horizon 1/(1-0.998) ~= 400 decisions
  gae_lambda: 0.98
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.025               # e.g. 0.02 to early-stop an epoch that moves the policy too far
  normalize_advantage: true

# Both schedules are functions of SB3's `progress_remaining` (1.0 at the first step -> 0.0 at
# total_timesteps). schedule: constant | linear | cosine | exponential.
learning_rate:
  schedule: linear
  initial: 2.0e-4
  final: 5.0e-5

clip_range:
  schedule: linear
  initial: 0.2
  final: 0.1

policy:
  cnn_output_dim: 160           # BrawlFeaturesExtractor: conv stack over the uint8 grid group
  mlp_hidden_dims: [256, 256]   # BrawlFeaturesExtractor: stacked MLP over every float32 group
  net_arch:                     # policy/value heads on top of the extractor
    pi: [384, 384]
    vf: [384, 384]

# VecNormalize. Observation normalization is OFF by default because every configs/agent_obs*.yaml
# already sets `normalize: true` (obs_select scales fields into sane ranges on-device, before
# the host transfer). Reward normalization is ON: shaped-reward magnitudes shift every time the
# curriculum advances, and a running return-scale keeps PPO's value loss well conditioned.
normalize:
  obs: false
  reward: true
  clip_obs: 10.0
  clip_reward: 10.0

# ShapedReward (brawl_sim/training/reward.py). Per-tick terms are in RAW sim units -- damage is
# on a ~1000-per-hit scale, hence the 1e-3 weights. Set any weight to 0.0 to disable that term.
reward:
  # --- terminal (fires once, on the tick the episode ends) ---
  win_bonus: 10.0               # hero was the last one alive
  death_penalty: -3.0           # hero died (combat or zone)
  rank_bonus: 0.5                # x places above last: 0 for 7th, 6.0 for 1st at n_enemies=6
  # --- per tick ---
  damage_dealt: 3.0e-4          # 1 rwd per 2000 hero damage
  damage_taken: -1.0e-4         # x hero damage taken this tick (combat only; zone is below)
  hp_healed: 1.0e-4             # x hero HP restored this tick (regen + super lifesteal); the
                                # mirror of damage_taken, so healing a wound off refunds what
                                # taking it cost. Capped by max HP, so it cannot be farmed.
  kill: 3.0                     # x enemies the hero killed this tick
  # RESTORED 2026-09-11 (was zeroed while no deploy spec could see a cube; see
  # configs/agent_obs_deploy3.yaml, which brought the grid's `box`/`pickup` channels back).
  #
  # Only pay for what the agent can see. A spec with no `pickup` channel and no `pickups.*` field
  # cannot see the thing this term pays for, and paying for it anyway trains an approach
  # behaviour that cannot transfer -- silently: the run looks fine and the deployment
  # underperforms for a reason nothing reports.
  #
  # This is a SHARED file and the specs differ, so the pairing is enforced per RUN, where the two
  # meet: brawl_sim/training/builder.check_reward_is_observable refuses to build a run that pays
  # this term under a spec that cannot see pickups. Retraining on agent_obs_deploy.yaml or
  # agent_obs_deploy2.yaml therefore needs `--set reward.cube_pickup=0`, and the error says so.
  # 0.7 since 2026-09-25 (was 0.5): the early game is where cubes are built, and deploy5 learned
  # to hold the zone edge instead. With every crate spot filled and bots that farm (bots/policy.py
  # loot constants) the lobby's richest bot holds 7+ cubes by 60 s in half of all matches, and the
  # hero's win rate at 60 s went 0.17 with 0-1 cubes, 0.42 with 2-3, 0.57 with 4-6. Cubes are
  # conserved, so the term is bounded by what is on the map, about 25 plus what kills drop.
  cube_pickup: 0.7              # x power cubes the hero collected this tick -- see above
  survive_per_step: 0.0       # flat, every tick the hero is alive
  in_zone_per_step: -0.05       # flat, every tick the hero is outside the safe rect
  # ADDED 2026-09-21 (SIM_OVERHAUL_PLAN.md §9 R2, operator-approved). x attacks and supers the hero
  # made while an enemy it can see stood inside its uncharged dash reach (2.67 + 0.70 + 0.40 = 3.77
  # tiles) -- the cadence audit's utilization criterion, which A1 measured at 0.339. At most one
  # per decision. Small on purpose: a twelfth of the 0.6 a landed 2000 hit pays, 1/60 of a kill, and
  # about 3 over a whole episode of attacking in reach, against 10 for a win. It also pays a dash
  # away from that enemy, and a miss; 0 turns it off.
  attack_in_reach: 0.05
  scale: 1.0                    # multiplies the whole sum; a global volume knob

# Stationary evaluation. Periodically plays a small, FIXED set of matches against each difficulty
# tier below, with the curriculum's sampling switched off and the same seed every time -- so the
# scenarios, maps, and bots are identical at 2M steps and at 20M steps.
#
# This is the only signal in the run comparable across time. `rollout/ep_rew_mean` is measured
# against the training distribution, which the curriculum deliberately makes harder, so it cannot
# tell "policy improved" apart from "curriculum got easier". These can.
#
# Logged as `eval/win_rate_<tier>` (also columns in logs/progress.csv) AND as one overlaid
# TensorBoard chart, `eval/win_rate`, with a line per tier (written to logs/eval_<tier>/).
# `best_model.zip` is saved whenever the mean win rate across tiers improves.
#
# Cost PER EVALUATOR -- and with `eval.holdout_maps` set (it is, below) there are TWO, so every
# figure in this block is paid twice; see the COST note on holdout_maps. One evaluator is
# one rollout of `len(tiers) * episodes_per_tier` envs, ALL RUN IN PARALLEL, bounded by
# sim.max_episode_steps ticks (3700 with this file's override) -- that tick cap does NOT scale with episodes_per_tier, since
# raising it only widens the batch, not the number of sequential rounds. This env is built ONCE
# and held in VRAM for the whole run (TierEvaluator is eager, not rebuilt per eval) -- a permanent
# memory cost, not just a slower periodic eval. Re-measured 2026-09-21 on an RTX 5070 Ti (17.1GB)
# as torch's peak ALLOCATED memory, never nvidia-smi: 4096 training envs and the model = 1.14GB,
# and one eval on each of the two evaluators (6 tiers x 300 = 1800 envs each) lifts the peak to
# 1.24GB -- comfortable headroom. (The ~2.95GB once quoted here was 4 tiers x 1000 eval envs.)
# At n=300/tier the win-rate standard error is at most ~2.9pp (vs ~8.8pp at the old n=32).
#
# Worth knowing: `every_timesteps` counts SB3 timesteps, which advance by n_envs (4096) per
# DECISION -- so 3_000_000 training timesteps is only ~732 decisions (~3660 sim ticks) of training
# progress. Each eval call can take up to cfg.max_agent_steps (740 here) decisions of its OWN
# (separate, wider) batch to finish. Those are different batches ticking independently, but in
# wall-clock terms a single eval can take longer than the training that happens between two evals,
# especially early on before episodes end quickly.
eval:
  enabled: true
  every_timesteps: 20_000_000      # decisions; = the pre-action_repeat 15M sim ticks. An eval
                                  # is TWO rollouts, training maps then holdout_maps below.
                                  # MEASURED 2026-09-21, RTX 5070 Ti, 6 tiers x 300 (1800 envs
                                  # per rollout), untrained policy: 49.3 s and 49.4 s, each
                                  # done in ~200 decisions at ~245 ms per decision. A rollout
                                  # ends when its longest first episode does, bounded by
                                  # cfg.max_agent_steps (740 at the 185 s episode above)
                                  # decisions, so ~180 s at most. One eval: ~100 s early, up
                                  # to ~6 min once the policy survives to the time cap. ~92 evals over 450M decisions:
                                  # ~2.5 h to ~7.5 h of the run.
  episodes_per_tier: 300
  tiers: []                     # empty = every tier under curriculum.tiers below
  deterministic: true           # argmax actions; lower variance, the usual choice for eval
  seed: 999983                  # unrelated to run.seed, so eval scenarios aren't ones seen in training
  at_start: true                # one eval before training starts, as the baseline
  # MAP-OVERFITTING EVAL (SIM_OVERHAUL_PLAN.md Step M4). Maps the run NEVER trains on: they are
  # absent from `run.env_overrides.world.maps` above, and the config is refused if one is not.
  # One standard point-symmetric map and one water_border map (families: brawl_sim/maps/README.md).
  # A second evaluator, identical to the first (same tiers, episodes_per_tier, seed, pinned bots)
  # except that its map bank holds ONLY these, runs right after it at every eval and logs
  #   eval/holdout_win_rate_<tier>, eval/holdout_win_rate (mean over tiers; mirrors
  #   eval/win_rate_mean), eval/holdout_gap (= win_rate_mean - holdout_win_rate),
  #   and tag eval/holdout_win_rate in each logs/eval_<tier>/ (one overlaid chart, a line per tier
  #   PLUS the run's own line on the same tag, which is the mean; eval/win_rate's mean is the
  #   separate eval/win_rate_mean chart).
  # Read the gap's TREND from the at_start row onward, not its sign: two maps are not exactly as
  # hard as the other fourteen, so an untrained policy already shows a small non-zero gap. A gap
  # that widens while eval/win_rate_mean climbs is the policy memorizing maps.
  # `best_model.zip` is still picked on the TRAINING-map mean alone -- choosing the checkpoint by
  # its holdout score would fit the choice to these two maps and spend the holdout.
  # COST: eval wall-clock DOUBLES (a second rollout of len(tiers) * episodes_per_tier envs per
  # eval, measured 49.4 s against the training maps' 49.3 s; see every_timesteps above), and a
  # second eval env of that size is held in VRAM for the whole run (both eval envs together
  # added ~0.1GB to the peak; see the memory note above). Set to [] or null to switch the
  # holdout eval off; a `--set run.env_overrides=...` that changes world.maps must keep these
  # two out of it.
  holdout_maps: [split_river, hollow_ring]

# ---------------------------------------------------------------------------------------------
# Difficulty curriculum.
#
# A "tier" is a set of MULTIPLIERS applied to configs/brawlers.yaml's own per-archetype numbers,
# so tier `hard` (all 1.0) is exactly the bots as authored there. Tiers are sampled per
# (env, archetype) on every reset, from the current stage's `tier_weights` -- so within one
# batch you face the advertised mixture, and within one episode different archetypes can sit at
# different tiers. Archetype SELECTION stays uniformly random throughout (entities.
# randomize_enemy_types in configs/default.yaml); the curriculum changes how well those bots
# play, not which ones show up.
#
# Advancement is adaptive: the win rate over the last `window_episodes` finished episodes must
# reach a stage's `advance_win_rate` (with at least `min_episodes_at_stage` episodes played at
# that stage) before it advances. The final stage has advance_win_rate: null and is terminal.
# Only episodes whose bots were drawn from the CURRENT stage count. The episodes in flight when a
# stage changes finish afterwards with the previous stage's bots, and are skipped.
#
# REBALANCED 2026-09-13. The previous ladder (easy -> elite, gates 0.2/0.3) reached its terminal
# stage 32M decisions into a 450M run (mortis_deploy3-20260911-203322) and finished at 54% against
# its own elite. One stage (hard_lean) cleared in 28 decisions, entirely on episodes started under
# the stage before it. That is why the skip rule above exists. What changed:
#   - the walk starts where the old one's fourth stage was ({medium 0.3, hard 0.7})
#   - `veteran` was the OLD elite verbatim, `expert` and `elite` stepped up to 2x HP, 1.75x damage
#     (both superseded 2026-09-18: the tier CONTENTS were retuned, see the note above `tiers:`)
#   - gates are 0.35 on a 2000-episode window; no stage may hold the run past 75M decisions
curriculum:
  enabled: true
  window_episodes: 2000         # rolling window the win rate is measured over (SE ~1 pp at 0.35)
  min_episodes_at_stage: 2000   # floor before a stage may advance; must not exceed the window
  demote_win_rate: null         # keep null: the first episodes to finish at a new stage are the
                                # short ones, i.e. early deaths, so a fresh window starts low
  max_timesteps_at_stage: 125_000_000   # force-advance a stalled stage, so the run always reaches
                                       # elite: worst case it gets there at 300M of 450M

  # Multipliers on the brawlers.yaml base value, applied to bot kinds only (never the hero).
  #   aim_noise       x aim_noise_std_rad and aim_noise_tiles  (HIGHER = worse aim)
  #   reaction_delay  x reaction_delay                         (HIGHER = slower to react)
  #   lead_target     x lead_target_fraction, clamped to [0,1] (LOWER  = worse at leading shots)
  #   decision_period x decision_period_ticks, floored at 1    (HIGHER = re-decides less often)
  #   move_speed      x move_speed
  #   hp              x base_hp
  #   damage          x base_damage
  #   aggression      x aggression (base 1.0 on every bot)     (HIGHER = retreats at lower HP, a
  #                                                             KITE holds closer, a CAMPER fires
  #                                                             on sight from 1.25 up). Must be > 0.
  #   hero_focus      x hero_focus (base 0.5), clamped to [0,1] (HIGHER = prefers the hero: he is
  #                                                             picked when his distance x
  #                                                             (1 - focus) beats the nearest bot's)
  #
  # Listed weakest to strongest (tests/test_training.py holds every knob to that order).
  # RETUNED 2026-09-18 (SIM_OVERHAUL_PLAN.md Step B4): HP and damage are capped at 1.5x, and what
  # separates the tiers is now accuracy, aggression and how hard the bots favor the hero. Below
  # hard those fall faster than HP/damage (an easy bot is a bad shot that runs away, not a paper
  # bot); above hard they keep climbing while HP/damage plateau. `hard` is still "brawlers.yaml as
  # authored", but brawlers.yaml itself now authors hero_focus 0.5, so NO tier's eval column
  # compares with a run from before this date. `easy` is in no stage and is kept only as the
  # bottom yardstick. `move_speed` stays 1.0 at every tier above hard on purpose: Mortis
  # (2.73 tiles/s) is only 6-14% faster than the ranged bots (2.40-2.57) and Edgar already matches
  # him, so a faster bot could kite him forever. That would make a matchup unwinnable rather than
  # hard.
  #
  # The elite `hp: 1.5` takes the largest possible normalized `entities.hp` (a 10000-HP Bull or
  # Buzz at 16 cubes: 10000 x 1.5 + 16 x 400 = 21400) to 1.07. That is just past the 1.0 that
  # obs_select's _NORM_HP_SCALE (20000) aims for, and nothing clips the value.
  tiers:
    easy:
      aim_noise: 3.0
      reaction_delay: 2.2
      lead_target: 0.25
      decision_period: 2.0
      move_speed: 0.90
      hp: 0.75
      damage: 0.70
      aggression: 0.6           # HUNTER/KITE retreat below 58% HP (0.35 / 0.6), not 35%
      hero_focus: 0.0           # -> 0.00: no preference, the hero is just another target
    medium:
      aim_noise: 1.8
      reaction_delay: 1.6
      lead_target: 0.60
      decision_period: 1.5
      move_speed: 0.95
      hp: 0.90
      damage: 0.85
      aggression: 0.8
      hero_focus: 0.4           # -> 0.20
    hard:                       # brawlers.yaml exactly as authored -- the reference bot
      aim_noise: 1.0
      reaction_delay: 1.0
      lead_target: 1.0
      decision_period: 1.0
      move_speed: 1.0
      hp: 1.0
      damage: 1.0
      aggression: 1.0
      hero_focus: 1.0           # -> 0.50: the hero at 7 tiles beats a bot at 4
    veteran:
      aim_noise: 0.6
      reaction_delay: 0.6
      lead_target: 1.0
      decision_period: 1.0
      move_speed: 1.0
      hp: 1.15
      damage: 1.15
      aggression: 1.2
      hero_focus: 1.3           # -> 0.65
    expert:
      aim_noise: 0.4
      reaction_delay: 0.45
      lead_target: 1.25
      decision_period: 0.75     # 4-tick deciders re-decide every 3; 2-tick ones stay at 2
      move_speed: 1.0
      hp: 1.30
      damage: 1.30
      aggression: 1.4           # past 1.25: an unseen CAMPER fires on sight from here up
      hero_focus: 1.5           # -> 0.75
    elite:                      # operator spec (S1): 1.5x health and damage, the rest is skill
      aim_noise: 0.20           # Brock's rocket bearing sd 0.06 -> 0.012 rad (0.7 deg)
      reaction_delay: 0.30
      lead_target: 1.5          # clamps at 1.0: every leading bot leads fully, Grom to 0.9
      decision_period: 0.5      # re-decides twice as often
      move_speed: 1.0
      hp: 1.50
      damage: 1.50
      aggression: 1.7           # retreats below 21% HP (0.35 / 1.7)
      hero_focus: 1.7           # -> 0.85: the hero at 13 tiles still beats a bot at 2

  # Walked in order. `tier_weights` need not sum to 1 -- they are normalized. Each stage's mixture
  # is at least as strong as the one before it at every tier boundary, which the tests check.
  stages:
    - name: hard_intro          # where the old walk's fourth stage was
      tier_weights: {medium: 0.3, hard: 0.7}
      advance_win_rate: 0.15
    - name: veteran_intro
      tier_weights: {hard: 0.6, veteran: 0.4}
      advance_win_rate: 0.15
    - name: veteran
      tier_weights: {hard: 0.3, veteran: 0.5, expert: 0.2}
      advance_win_rate: 0.15
    - name: expert
      tier_weights: {hard: 0.1, veteran: 0.3, expert: 0.4, elite: 0.2}
      advance_win_rate: 0.15
    - name: elite               # terminal; 10% hard is the old terminal's anti-overfitting share
      tier_weights: {hard: 0.1, veteran: 0.15, expert: 0.25, elite: 0.5}
      advance_win_rate: null
