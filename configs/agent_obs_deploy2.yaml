# DEPLOYABLE agent view, second of the deploy line: configs/agent_obs_deploy.yaml with the ZONE
# GROUP rebuilt around what the live loop can reconstruct. Every other group is byte-identical to
# its parent; tests/test_configs_files.py pins that.
#
#   python scripts/train.py --set run.agent_obs=configs/agent_obs_deploy2.yaml
#
# WHY THE ZONE GROUP CHANGES (BRAWL_DEPLOYMENT_DESIGN.md §9.14)
# -------------------------------------------------------------
# The zone is drawn on screen, but the parent's zone fields are functions of the SAFE RECT and its
# SCHEDULE, and a camera that follows the hero recovers neither. Measured on
# tests/fixtures/vision/bluestacks-example-zone.mp4:
#
#   zone.next_shrink_in   STRUCTURALLY UNOBSERVABLE, dropped. The gas front advancing and the gas
#                         front merely being REVEALED as the camera pans are the same pixels (the
#                         visible front moved 7 tiles in 3 s at t~21-24 s purely from reveal). In
#                         an inference-time ablation, zeroing it cost 1.5 pp and a plausible wrong
#                         number cost 4.4 pp, so dropping it is the better move.
#
#   zone.safe_area_frac   NO SUPPLIER, dropped. It needs the map's total extent, which the deployed
#                         loop never learns: it has an odometry-anchored 128x128 canvas, not a map.
#                         The grid's `in_zone` channel already carries the safe area's LOCAL shape,
#                         which is what a fleeing decision uses.
#
#   zone.hero_margin      REPLACED by zone.hero_margin_local. It is the field that matters: zeroing
#                         the whole zone group cost 10.4 pp, the only large reproducible effect in
#                         two ablation passes.
#
# THE REPLACEMENT: hero_margin -> hero_margin_local
# -------------------------------------------------
# Both are (x-lo.x, hi.x-x, y-lo.y, hi.y-y), four signed distances in tiles, negative = outside on
# that side. The local one is clamped to +/- `zone.margin_horizon_tiles` (configs/default.yaml,
# 10 tiles), and the clamp is the shape of the deployed estimator, not a safety rail.
#
# brawl_deployment has no rect to subtract from. Its GasMap is a sticky, odometry-anchored record
# of cells it has SEEN gassed, and it answers "how far to gas along -x, +x, -y, +y". Beyond the
# horizon that scan returns nothing and the answer saturates, so the sim saturates too. There is
# exactly ONE number: the estimator reads `zone.margin_horizon_tiles` from the run's env_config,
# so the two halves cannot drift. Do not hardcode it on either side.
#
# The clamp is symmetric because the blindness is: standing deep in gas, the nearest clear ground
# is as far outside the sensor as distant gas is when standing safe.
#
# `tiles` normalizes by 60 (the map's extent), so a horizon of 10 makes this the narrowest column
# in the vector (+/-0.167). That is a smaller input scale, not an unnormalized one. Do not "fix" it
# with a per-field divisor: obs_select._norm_divisor is keyed by UNITS on purpose, and
# tests/test_configs_files.py asserts that property, not a list.
#
# WHAT THIS DOES NOT MODEL
# ------------------------
# GasMap only marks a cell gassed when that cell was on screen. Cells the hero never looked at
# stay `clear`, so the estimator's error is ONE-SIDED OPTIMISTIC: it under-reports danger where
# the hero walked away from, which is where the gas goes. The clamp bounds that error at the
# horizon; it does not remove it. Modelling it would need a per-env visibility memory in the sim,
# for an effect the ablations put in the low single digits. Also measured and not modelled:
#
#   staleness      A margin up to 6 s old cost 2.2 pp; a delay line in training would add noise to
#                  every episode to buy back a fraction of that.
#   axis asymmetry The screen is wider than it is tall, so +/-x is sensed further than +/-y. A
#                  three-condition ablation came back non-monotone (0.697 / 0.724 / 0.704), i.e.
#                  noise, so the horizon is ONE scalar, not two.
fair: true
normalize: true
groups:
  - name: self                          # unchanged from agent_obs_deploy.yaml
    per_entity: false
    dtype: float32
    fields: [hero.pos_norm, hero.vel, hero.facing_vec, hero.hp, hero.ammo_frac,
             hero.ammo_whole, hero.attack_cd, hero.can_attack, hero.dashing,
             hero.dash_t, hero.dash_dir, hero.invuln, hero.in_bush, hero.in_zone,
             hero.long_dash_ready, hero.long_dash_frac,
             hero.super_ready, hero.super_charge_frac,
             meta.time_frac, meta.n_enemies_alive]
  - name: enemies                       # slots 1..n_enemies, index-stable, gated by fair
    per_entity: true
    dtype: float32
    # Unchanged from agent_obs_deploy.yaml, whose header explains every removal: kind_onehot by
    # lowinfo, cubes/can_attack/dashing as unsuppliable, hp_frac -> hp because cubes move max_hp.
    fields: [entities.alive, entities.revealed_to_hero,
             entities.rel_pos, entities.dist, entities.rel_vel, entities.hp,
             entities.in_bush]
  - name: projectiles                   # nearest K by time_to_closest, K = 12 -- NOT index-stable
    per_entity: true
    max_slots: 12
    dtype: float32
    # Unchanged. A moving dot and nothing more.
    fields: [projectiles.alive, projectiles.rel_pos, projectiles.vel,
             projectiles.time_to_closest]
  - name: zone                          # the ONLY group that differs from agent_obs_deploy.yaml
    per_entity: false
    dtype: float32
    # 7 columns -> 5. hero_margin -> hero_margin_local (clamped at the sensing horizon),
    # safe_area_frac and next_shrink_in dropped outright. See the header for each.
    fields: [zone.hero_margin_local, zone.active]
  - name: grid                          # bare occupancy counts, no kind, no class -- and two
                                        # channels shorter than lowinfo's. See below.
    dtype: uint8
    # No `box` or `pickup` channel, as in agent_obs_deploy.yaml: a run on this spec cannot see
    # crates or cubes, so it needs `--set reward.cube_pickup=0`
    # (brawl_sim/training/builder.check_reward_is_observable). agent_obs_deploy3.yaml adds both.
    view_channels: [blocks_unit, blocks_projectile, is_bush, is_water, in_zone,
                    enemy_revealed, hero, projectile]
