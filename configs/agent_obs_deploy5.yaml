# DEPLOYABLE agent view, fifth pass -- configs/agent_obs_deploy4.yaml plus `hero.near_edge` in
# `self` and `slots: tracked` on `enemies` (OBS_PARITY_PLAN.md rev 3; OBS_PARITY_TASKS.md C1-C10).
# `projectiles`, `zone`, `history` and `grid` are byte-identical to the parent's, and so is every
# `enemies` field; tests/test_configs_files.py pins that.
#
#   python scripts/train.py --set run.agent_obs=configs/agent_obs_deploy5.yaml
#
# WHY A SEVENTH FILE RATHER THAN AN EDIT
# --------------------------------------
# Same reason as the last four. `runs/*/train.yaml` names its spec BY PATH. agent_obs_deploy4.yaml
# is what runs/mortis_deploy4-20260921-185945 trained on and what configs/deployment.yaml still
# serves; widening it would make it mean two different widths depending on when you read it.
#
# WHAT CHANGED (2026-09-24)
# -------------------------
# Every change closes a place the sim hero knew something the deployed loop could not
# (OBS_PARITY_PLAN.md, the operator's decisions). Two add or reorder columns; two change what an
# existing observation means and leave every column where it was.
#   window    (no column) The sim hero sees what the SCREEN shows. `hero_view` is the camera's
#             ground quad around the CLAMPED camera (core/camera.py; `camera.quad` and
#             `camera.clamp_onset` in configs/default.yaml, both measured from footage), not a
#             hero-centred rectangle. Every `*.in_view`, `entities.revealed_to_hero`, the grid's
#             enemy planes, the history planes and the projectile fairness mask read through it;
#             the 13 x 21 grid crop itself stays hero-centred. Near a map edge the camera stops
#             following the hero, so the window goes off-centre exactly as it does on the phone.
#   self      + hero.near_edge right after hero.in_zone, so the two "where am I" bits read
#             together. 1 when the camera has stopped following the hero: |hero - cam| >
#             `camera.edge_flag_tiles` (2.0) on either axis. It is the only thing on screen that
#             says "map edge"; the operator's test for it is that the hero must not waste time
#             trying to run off the map.
#   enemies   `slots: tracked`. The rows follow the sim's tracker-style slot table (core/slots.py,
#             `slots:` in configs/default.yaml) instead of entity index: an enemy needs
#             `promote_hits` (2) consecutive sightings to take the lowest free slot, keeps it
#             through `max_misses` (3) unseen decisions and loses it on the fourth, and a
#             returning enemy takes whichever slot is free, so identities shift the way
#             EntityTracker's do live. Both counts are DECISIONS, because the tracker updates once
#             per decision. Same shape, (n_enemies, 9). `fair` still zeroes the row of a slotted
#             enemy that is not revealed this decision, so a coasting slot reads like an empty
#             one; what the order changes is WHICH row a revealed enemy lands in, and that the
#             row can move.
#   zone      (no column) zone.active is a LATCH: 0 until gas has been on screen at least once in
#             the episode, then 1 for the rest of it (core/zone.mark_seen), which is what
#             ZoneEstimator.active means live. It used to read 1 from the first decision whenever
#             the zone was enabled.
#
# Normalization is unchanged: near_edge is a bool like in_bush and in_zone, and the enemies rows
# keep every divisor they had.
#
# Six groups is obs_select._MAX_GROUPS: each group is its own device-to-host copy. The next field
# joins an existing group; a seventh group will not load.
#
# ------------------------------------------------------------------------------------------------
# DEPLOYABLE (2026-09-24) -- what supplies the new fields
# ------------------------------------------------------------------------------------------------
# Every new field passes the deploy rule: the live loop supplies it without a new detector.
#   hero.near_edge     TrackerResult.hero_offset (OBS_PARITY_TASKS.md C7): the player box's tile
#                      position against its nominal screen anchor, the viewport centre plus
#                      camera.HERO_ANCHOR_TILES pushed through the same rectify plan as every
#                      detection, so the plan's origin_tile cancels. The assembler takes
#                      |offset| > camera.edge_flag_tiles on either axis, and only when the spec
#                      names the field; the loop logs the offset and the bit per decision
#                      (`hero_offset_x/y`, `near_edge` in the tick telemetry).
#   enemies (tracked)  Nothing new. EntityTracker already promotes on the second sighting, coasts
#                      three misses and re-uses the lowest free slot; the assembler writes track k
#                      to row k and reports the identity permutation as its slot table. The sim's
#                      rule was fitted to the tracker decision by decision
#                      (tests/test_deployment_tracker.py).
#   window, latch      Nothing to supply: they change what the sim shows, not what the loop reads.
# tests/test_deployment_loop.py and tests/test_deployment_zone.py glob this file and serve it like
# every other deploy spec; tests/test_deployment_grid.py loads its grid both ways and
# tests/test_deployment_assemble.py checks the new bit and the slot order against the sim.
#
# WIDTH CHANGES: self 26 -> 27 floats (near_edge is column 18; long_dash_ready and everything after
# it move up one, so the gadget pair is 23 and 24). Every other group keeps its shape, and the
# extractor takes 13 grid channels and 263 floats. Not a checkpoint swap; train from scratch.
fair: true
normalize: true
groups:
  - name: self                          # deploy4's, plus hero.near_edge after hero.in_zone
    per_entity: false
    dtype: float32
    fields: [hero.pos_norm, hero.vel, hero.facing_vec, hero.hp, hero.ammo_frac,
             hero.ammo_whole, hero.attack_cd, hero.can_attack, hero.dashing,
             hero.dash_t, hero.dash_dir, hero.invuln, hero.in_bush, hero.in_zone,
             hero.near_edge,
             hero.long_dash_ready, hero.long_dash_frac,
             hero.super_ready, hero.super_charge_frac,
             hero.gadget_ready, hero.gadget_charge_frac,
             meta.time_frac, meta.n_enemies_alive]
  - name: enemies                       # n_enemies rows in TRACKED-SLOT order, gated by fair
    per_entity: true
    slots: tracked                      # NEW: row k is the enemy holding tracker slot k (header)
    dtype: float32
    # Fields unchanged since agent_obs_deploy3.yaml. agent_obs_deploy.yaml's header explains every
    # removal: kind_onehot by lowinfo, cubes/can_attack/dashing as unsuppliable, hp_frac -> hp
    # because cubes move max_hp.
    fields: [entities.alive, entities.revealed_to_hero,
             entities.rel_pos, entities.dist, entities.rel_vel, entities.hp,
             entities.in_bush]
  - name: projectiles                   # nearest K by time_to_closest, K = 12 -- NOT index-stable
    per_entity: true
    max_slots: 12
    dtype: float32
    # Unchanged. A moving dot and nothing more.
    fields: [projectiles.alive, projectiles.rel_pos, projectiles.vel,
             projectiles.time_to_closest]
  - name: zone                          # unchanged from agent_obs_deploy3.yaml
    per_entity: false
    dtype: float32
    fields: [zone.hero_margin_local, zone.active]
  - name: history                       # NEW: the hero's last three decisions, see the header
    per_entity: false
    dtype: float32
    fields: [hist.valid, hist.move_onehot, hist.attack_onehot, hist.hp, hist.ammo_frac,
             hist.displacement]
  - name: grid                          # deploy3's ten planes, then the three history planes
    dtype: uint8
    view_channels: [blocks_unit, blocks_projectile, is_bush, is_water, in_zone,
                    enemy_revealed, hero, box, pickup, projectile,
                    enemy_hist1, enemy_hist2, enemy_hist3]
