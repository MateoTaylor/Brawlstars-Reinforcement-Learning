# brawl_deployment tunables. See BRAWL_DEPLOYMENT_DESIGN.md and brawl_deployment/config.py.
#
# SETTINGS live here -- numbers where a different value is a different judgment call.
# MEASUREMENTS live in brawl_deployment/data/control_calibration.json: the joystick anchor, its
# saturation radius and the button centres are outputs of scripts/deploy_calibrate.py, regenerated
# rather than edited, and meaningless to hand-tune.
#
# WHAT IS NOT IN THIS FILE IS AS IMPORTANT AS WHAT IS. The DECISION cadence and
# meta.time_frac's denominator are DERIVED from the training config the checkpoint was produced
# under (dt, action_repeat, max_episode_steps). A knob for either would be a second source of
# truth for the thing that must match training exactly, and the failure is a policy stepping at a
# rhythm it never saw while every number on screen still looks plausible. Likewise the capture
# viewport (read from the camera model) and the monitor index (resolved from the emulator window).
#
# The PERCEPTION rate is the one rate that IS a setting (loop.tick_hz below), because the
# checkpoint has no opinion about it -- it never sees the refreshes between its own decisions.
# It is still not free: resolve_rates() admits only values that divide the 250 ms decision period
# into whole ticks, and validate() rejects any that would put a Mortis dash past
# odometry.max_shift_tiles. config.py's module docstring lists the rest and why.

run:
  # The run directory carries its own train.yaml, which names the env config AND the agent_obs
  # spec. Those are deliberately NOT repeated here: a spec path in this file could disagree with
  # the one the checkpoint was trained against, and policy.py's guards exist because that
  # disagreement is silent -- the observation is the right WIDTH with the wrong columns in it.
  #
  # This is the DEFAULT run. `scripts/deploy_run.py --run <name> [--checkpoint best|final]` plays a
  # different one for a single invocation, by the name it was trained as, without editing this file.
  # Repointed 2026-09-22. It named the deploy3 run, which is pre-gadget AND was
  # deleted, so a live run would have failed on a missing path and the pre-flight test SKIPPED
  # rather than failing -- see test_deployment_policy.py's dangling-pointer guard.
  # Repointed 2026-09-25 to deploy5 (its offline gates passed). deploy5
  # is the first spec that reads `hero.near_edge`, which needs the tracker's player-box offset
  # (`tracker.PLAYER_BOX_FROM_RING_TILES`) that landed the same day. deploy4 stays playable with
  # `--run mortis_deploy4-20260921-185945`.
  # Repointed 2026-09-26 to mortis_ppo, the first run trained on the audited sim (design 9.22:
  # no dash i-frames, bots that farm, the 1.3x gas). It ended in the expert stage with every
  # advance forced at the 100M cap; final eval 0.23 at hard, 0.05 at elite, 300 episodes per
  # tier. deploy5 stays playable with `--run mortis_deploy5`.
  dir: runs/mortis_ppo-20260925-194025
  checkpoint: best_model.zip

policy:
  # MEASURED (design 6.7): 0.96 ms on CPU against 7.56 ms on CUDA for one batch-1 decision, at
  # 1.04M parameters. CPU wins 8x at this size -- the transfer dominates the arithmetic -- and it
  # leaves all 16 GB of VRAM to the detectors, which is where VRAM is actually scarce.
  device: cpu
  # The stochastic policy is a training-time exploration device. A deployed agent sampling from
  # its own action distribution adds noise to a decision it already made and makes every failure
  # unreproducible.
  deterministic: true
  # The dead-bin move mask (brawl_deployment/move_mask.py, design 6.16): a bin that would walk
  # the hero into a wall on the grid the policy sees is masked, the way an uncharged super is.
  # MEASURED 2026-09-23 in the sim: wall-pushing decisions 2.2% -> 0.0%, 2 s stalls gone, win
  # rate unchanged within noise. `false` is the A/B switch, not a tuning.
  dead_bin_mask: true

compute:                  # design 7.2
  # The emulator is a VM on the same eight cores, and it is what lags when this process burns
  # them. MEASURED 2026-09-16 (the real tick replayed at 12 Hz, process-scoped CPU): with the
  # library defaults -- torch 8 threads, two ORT sessions with spinning pools, cv2 16 -- the
  # process held 3.3-4.2 cores while sleeping a third of every tick, because idle pool threads
  # spin-wait rather than sleep. With these caps it holds 1.0 core and the tick is FASTER (48 vs
  # 55 ms median): the CPU-side work is tiny and the pools were overhead. The GPU work is
  # untouched -- detector_threads reaches only the CPU side of a CUDA session (letterbox, NMS).
  # torch 1: the policy is the only CPU network and 1 thread runs it in the same 0.96 ms.
  torch_threads: 1
  # cv2 does real parallel work in the warps and odometry correlations: 1 thread pushed the tick
  # to 68 ms median, 4 keeps it at 48 with the tightest tail measured.
  cv2_threads: 4
  detector_threads: 2
  detector_spin: false

window:                   # design 6.9
  exe: HD-Player.exe      # matched on the process image; titles and Qt class names are not stable
  # A windowed emulator is a different projection, not a smaller picture of the same one: the
  # homography, the HUD mask and the tap anchors were all measured against a fullscreen client
  # area. Turning this off means recalibrating, not merely accepting a smaller picture.
  require_fullscreen: true
  # mss grabs the DESKTOP, so any window in front of the emulator is what the pipeline sees. This
  # detects that and the loop pauses -- releases contacts, keeps capturing, resumes when clear.
  # Note the consequence, which is an operating constraint and not a bug: on a single monitor
  # there is no arrangement where someone watches the agent in another window on the same screen.
  check_occlusion: true
  # Ticks between occlusion probes; 20 is once a second at the derived capture rate. Five
  # WindowFromPoint calls cost microseconds, so this is not a cost tuning -- it is how long the
  # agent may keep playing into a covered screen before it notices.
  check_every_n_ticks: 12

capture:
  # null means "the monitor the emulator window is on", resolved by window.monitor_index_for.
  # An explicit index is an override for when that resolution is wrong, not the normal path.
  # Never 0: mss's index 0 is the union of every display, and capturing it would hand
  # detect_content_box a frame containing a second monitor.
  monitor: null

control:
  # "adb" drives the emulator. "null" runs the entire loop -- capture, perception, policy,
  # telemetry -- and emits no input at all. That is the mode for the first run of any change to
  # perception or the policy, and it is worth using more often than it feels like it should be.
  backend: adb
  # null asks find_adb_serial to read the single running instance out of bluestacks.conf.
  adb_instance: null
  # WHERE TO TAP TO FIRE, as a fraction of the DEVICE screen (1920x1080), so (0.88, 0.55) is
  # (1690, 594).
  #
  # This is a SETTING, and that is the correction from design 6.8. Attack is an AREA, not a
  # button: any tap on the right side of the screen fires so long as it misses the Super and
  # gadget buttons, and the attack stick FLOATS to the touch point exactly like the movement
  # stick. So this is chosen for CLEARANCE -- the same way 4.3 chose the joystick anchor -- and
  # pointing it at the measured button centre would be a downgrade, not a fix. Since 2026-09-22
  # there is no measured attack centre to point it at either: the disc the calibration called
  # `attack` is the GADGET, and the attack stick's own rest circle is deliberately uncalibrated
  # because it floats to wherever it is touched. At 1920x1080 this point sits ~333 px from the
  # Super and ~403 px from the gadget, above the button cluster and inside the right edge, which
  # also keeps it clear of venue-specific buttons drawn over the attack area (a green chevron in
  # Training Grounds swallowed 2 of 3 taps at the old anchor). Both clearances are unchanged
  # measurements under corrected names: 333 px was reported as the distance to `gadget`, and the
  # old "450 px from super" was the distance to a third disc nothing presses.
  #
  # UNVERIFIED IN A REAL MATCH. scripts/deploy_calibrate.py confirms it by tapping once and
  # asserting read_ammo decrements, which is the venue-independent check and the one that would
  # have caught the chevron immediately.
  attack_tap: [0.88, 0.55]
  # HOW FAR TO DRAG an attack or super press, in DEVICE pixels, along the move direction (the move
  # bin, or the way the hero last faced when idle -- where the sim's dash goes). A press goes down
  # on attack_tap (or the super button), drags this far on the next tick, and lifts on the one
  # after; the lift fires. Never a bare tap: the game auto-aims those at the nearest enemy, which
  # the policy never trained on.
  #
  # Direction only -- the dash and the super travel a fixed distance -- so this just has to clear
  # the game's aim deadzone. 75 is ~70% of the movement stick's 110 px ring. The ceiling is still
  # the super button, but it is now 179 px above the bottom edge rather than 81: the 81 px disc
  # was never the Super (2026-09-22). A radius past the ceiling is refused at startup, because an
  # off-screen point is clamped to the edge and the shot would go the wrong way.
  #
  # UNVERIFIED IN A REAL MATCH. The calibration tap job proves the press fires (ammo drops); watch
  # that the dash goes the way the stick was held, too.
  aim_radius_px: 75

loop:                     # design 6.13
  # Perception ticks per second. The DECISION rate is not here: it is dt * action_repeat = 250 ms
  # from the training config, and only rates that divide that into whole ticks are accepted
  # (20 / 16 / 12 / 8 for this checkpoint). Anything else raises rather than rounding, because
  # rounding stretches the agent's step onto a rhythm it never trained on.
  #
  # 12 rather than the sim's own 20, and MEASURED (design 6.13): at 20 Hz the loop does not fit
  # inside 50 ms -- 27.1 ms of stage work per plain tick and 34.7 per decision tick, plus a ~24 ms
  # live grab. The pacer does not sleep on an overrun, so 20 Hz does not give a slow loop, it
  # gives a JITTERING one, with the decision window landing near 263 ms instead of 250. At 12 Hz
  # every tick fits with ~20 ms spare on the worst measured frame, the decision window is exactly
  # 250 ms, and the spare absorbs this machine doing other work at the same time.
  #
  # The price, both halves measured: a Mortis charged dash covers 1.48 tiles per frame instead of
  # 0.89 against odometry.max_shift_tiles = 2.0, and projectiles get the two looks a velocity needs
  # on 21% of shots instead of 44%. The second is concentrated rather than spread -- shots on
  # screen >=200 ms (the ones there is time to react to) are 100% covered at 12, 16 and 20 Hz
  # alike, and the whole difference is the 100-200 ms band at 99% -> 42%.
  #
  # 16 is the next step up if a live run shows the budget is kinder than the estimate, or if
  # dodging looks bad in that band. 8 is not an option -- 2.22 tiles per dash frame, past the
  # bound, so every dash would reset the world model.
  tick_hz: 12

shadow:                   # design 6.3
  # Consecutive ammo mismatches before resyncing the shadow hero from CV. Three, not one: a lone
  # mismatch is as likely to be a pip bar misread mid-reload as a real desync, and resyncing on it
  # reseeds the unobservable timers conservatively for no reason.
  ammo_strikes: 3
  # Resyncs inside one match before the run is called lost. Sustained desync means our actions are
  # not landing, and an agent whose model of itself is wrong is worse than a stopped one.
  max_resyncs: 5

safety:
  # The match gate is the primary interlock; this is the backstop for the gate itself being wrong.
  # Generous on purpose -- a match runs ~150 s and this should never be what ends one.
  max_match_seconds: 300.0
  # A gap this long between frames means capture has stalled, and odometry's per-FRAME shift bound
  # is already violated. Release and stop.
  capture_stall_seconds: 1.0

telemetry:
  # Scalars only, append-only, one row per decision. Never frames: at 20 Hz a 1440p BGR history is
  # ~124 MB/s, so a three-minute match would be ~22 GB (design 7).
  dir: runs/deploy
  # Frames to dump for debugging, hard-capped. 0 = off, and 0 is the only value that should
  # survive into an unattended run.
  frame_dump: 0

map:                      # KNOWN_MAP_LOCALIZATION_PLAN.md
  # The hand-labelled map the match is played on, brawl_deployment/data/maps/<name>.csv. null
  # keeps the map-agnostic terrain: the occupancy map, in odometry's frame on the crate lattice.
  # Named, the loop finds the camera on the label, hands out the map frame (world = map tile - 30)
  # and gives the policy the label's terrain while it has a fix. Usually set for one session with
  # `deploy_run.py --map dark_passage` instead of here.
  name: null
  # The localizer's thresholds, at MapLocalizer's defaults (brawl_deployment/perception/
  # localize.py). Margins are in scored cells, agreements are rates in [0, 1].
  # K4 (2026-09-28) kept the plan's values. On the 3 tuning recordings, fresh and back to back on
  # one stack, every landing committed on the right spawn within 0.1 s of the gate (the lead hit
  # commit_margin by the second tick) and no fix was dropped. The fix's smoothed agreement had a
  # 5th percentile of 0.64-0.65 against guard_agreement, and no neighbour's lead came within 22
  # cells of slip_margin. whole_map_margin and wrong_map_agreement were not exercised: no fix was
  # lost, and the map was right. The held-out pair, replayed once: both landed right at the gate.
  # One dropped a right fix 23 s in, where the view read under 0.6 at every placement; the
  # whole-map search led by whole_map_margin within 0.8 s, but its agreement peaked at 0.648,
  # under min_agreement, so 39% of that match went without a fix. Since then (the user's call,
  # 2026-09-28) min_agreement holds only until the match's first fix. After it, a commit needs
  # only guard_agreement, the rate that keeps a fix: in the search after a drop, and in a cut's
  # confirm. The tuning recordings never searched after their first fix, so they are unchanged.
  # K5 (the user's call, 2026-09-28): a commit in the spawn windows needs only guard_agreement
  # too. The first live held-out landing led by commit_margin from its first tick but agreed at
  # 0.62-0.65 and never fixed, and on synthetic views no other map's view committed in the windows
  # at 0.6. So min_agreement now holds only in the whole-map search before a first fix.
  commit_margin: 60.0       # the leader's lead needed to commit, in a spawn or after-cut window
  whole_map_margin: 120.0   # the same, once the search has widened to the whole map
  slip_margin: 15.0         # a neighbour's smoothed lead that moves the fix a tile
  min_agreement: 0.65       # a whole-map commit before the match's first fix needs this rate
  guard_agreement: 0.6      # under this for 2 s near the fix, it is dropped; other commits need it
  wrong_map_agreement: 0.55 # the landing search's best under this means the wrong map
  search_tiles: 4           # after an odometry cut, how far the fix is searched for
  search_seconds: 5.0       # landing: spawn windows only for this long; a cut: time to confirm
