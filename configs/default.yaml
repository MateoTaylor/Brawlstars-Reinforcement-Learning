seed: 0
device: cuda

world:
  map_h: 60
  map_w: 60
  # The SIM's map list: six hand-authored maps, ten generated ones, five transcribed from Solo
  # Showdown screenshots and fifteen generated from their families (brawl_sim/maps/README.md).
  # Every name must also be in brawl_sim/config.py `_KNOWN_MAP_NAMES`. A run trains on
  # train.yaml's `run.env_overrides.world.maps`, which REPLACES this list, so a map added here
  # does not train until it is added there too. No agent obs spec reads the map id, so a
  # checkpoint resumes fine on a different pool. Fences are not a sim tile; the loader refuses
  # the character.
  #
  # `walled` is deliberately NOT here: it is the only 60x60 map with no bush at all, so nothing
  # on it exercises concealment. It stays in the repo as a fixture (tests/test_map_csvs.py
  # checks its water) and can still be pinned by hand with scripts/watch.py --map walled.
  maps: [open, bushy, skull_creek, feast_or_famine, scorched_stone, island_invasion,
         broken_wall, stone_fort, twin_ponds, cross_creek, split_river, narrow_pass,
         dry_gulch, thorn_field, reed_marsh, hollow_ring,
         hot_maze, ghost_point, shadow_spirits, crescent_lakes, twisting_vines,
         pond_maze, canal_maze, picket_maze, lagoon_ring, square_lakes, bush_halo,
         bramble_ponds, bramble_bend, bramble_stars, moon_gate, half_moon, moon_pools,
         vine_springs, vine_canal, vine_hollow]
  map_selection: uniform
  fixed_map: open
# MEASURED from the real Solo Showdown camera, not chosen (Terrain_Perception_Build_Plan.md
# Phase K). The corners of the normalized viewport (2002x1126) pushed through the Phase C
# homography's H_inv give the ground the camera sees: a trapezoid 28.9 tiles across its far edge,
# 23.3 across its near one and 18.4 tall. The view is the largest axis-aligned rectangle INSIDE
# that quad, centred on the HERO (`_view_origin` is `hero_ix - view_w // 2`): a bounding box
# would hand the policy the trapezoid's missing corners, which it will not have at deploy time.
# That is 22.90 x 14.03 tiles, because the hero sits +0.09 tiles right of the viewport centre and
# +0.80 below it (anchor: the green ground marker under the local player, on frames where the
# camera tracks the player; it does not always, see README "Known divergences").
#
# The window is pinned to the hero's CELL, so it slides by up to a tile and EVERY placement has
# to fit. 21x13 clears the footprint by 0.024 tiles, while 23x13 misses by 0.54 and 21x15 by
# 0.98. Odd sizes also centre the hero exactly. tests/test_vision_camera.py re-derives all of
# this from the shipped homography, so a recalibration that changes the field of view fails there.
view:  {height: 13, width: 21}

# The camera as the sim models it. `quad` is the ground the screen shows: a trapezoid in tiles
# relative to the hero's nominal screen anchor (the viewport centre + (0.09, 0.80) tiles, see
# `view`), corners TL, TR, BR, BL with y down. The sim reveals enemies inside it and nothing
# outside it, because that is all the deployed detector can see; tests/test_sim_camera.py
# re-derives the corners from the shipped homography.
# `clamp_onset` is how far from each map edge (tiles) the game's camera stops following the hero,
# so near an edge the hero drifts off-centre on screen. Geometry defaults: the quad's extent on
# that side minus the user's allowance of ~2 tiles of visible off-map ground. They are still
# unmeasured: no footage has the hero at a map edge, so footage only bounds them from below
# (BRAWL_SIM_DESIGN.md §9).
# `edge_flag_tiles` is the hero-to-camera offset past which `hero.near_edge` is set. The deployed
# side thresholds, at the same number read from this file, the tracked hero box's offset from its
# nominal point: the viewport centre + HERO_ANCHOR_TILES + tracker.PLAYER_BOX_FROM_RING_TILES.
camera:
  quad: [[-14.11, -10.59], [14.77, -10.93], [11.73, 7.45], [-11.55, 7.01]]
  clamp_onset: {west: 12.1, east: 12.8, north: 8.9, south: 5.5}
  edge_flag_tiles: 2.0

# Enemy observation slots behave like the deployed `EntityTracker`'s: an enemy needs
# `promote_hits` sightings to get a slot, keeps it through `max_misses` unseen decisions, and slots
# are re-used lowest-free-first, so identities shift the way they do live. Both are counted in
# DECISIONS: the tracker updates once per decision, not per perception tick.
slots:
  promote_hits: 2
  max_misses: 3

sim:
  dt: 0.05                         # SIM tick = 20 Hz, the rate the world updates at
  max_episode_steps: 3000          # SIM TICKS, i.e. 150s of game time -- NOT agent steps
  # How many sim ticks one AGENT DECISION covers (env.py `_run_decision`): 20 Hz / 5 = 4 Hz,
  # roughly how often a human changes their mind in this game. MOVEMENT is held across the
  # window; the attack column applies on the first sub-tick only, so one decision is at most
  # one attack, as MaskablePPO's once-per-decision action mask promises. Every attack_cooldown
  # in brawlers.yaml is at least one window (0.25 s), so nobody could fire twice in one anyway.
  # The hero's attacks do land on decision boundaries: Mortis's 0.35 s cooldown chains at
  # 0.50 s (BRAWL_SIM_DESIGN.md §5). Bots fire on their own sub-tick schedule.
  #
  # So an episode is max_episode_steps / 5 decisions (cfg.max_agent_steps), one SB3 timestep is
  # one decision (every step count in train.yaml is in decisions), and gamma discounts per
  # decision. Reward is NOT affected: per-tick terms sum over the window, so the episode return
  # does not depend on this value (brawl_sim/training/reward.py). Bot decision periods, the zone
  # schedule, regen and cooldowns all run on the sim clock. 1 = a decision every tick.
  action_repeat: 5
  action_latency_seconds: 0.001    # rounds to 0 ticks at 20 Hz; buffer is a pass-through

action:
  n_move_bins: 16
  dash_on_idle: facing
  # auto_aim adds a fifth attack value, 4 = auto-aimed attack: the dash goes straight at the
  # nearest alive enemy or unbroken crate within the dash's reach (visibility ignored, so a
  # policy that tracks an enemy out of frame can hit it) and along the move bin when nothing
  # is in reach. It widens action_nvec, hist.attack_onehot and action_mask.attack, so it is
  # `false` here and `true` only in a run's env_overrides (user decision): a run trained without
  # it keeps loading. Live, value 4 is a bare tap on the attack button, which the game auto-aims.
  auto_aim: false

observation:
  include_world_grid: true
  include_privileged: true
  # visibility.los and entities.los_from_hero: physical (wall-only) line of sight between every
  # entity pair, a full-length wall march on every obs build. No agent obs group, reward or
  # callback reads them, so train.yaml turns them off; the viewer draws its own.
  include_raw_los: true
  # A projectile slower than this many tiles/s reads as still in the agent's observation (`vel`
  # 0, `time_to_closest` 0), as the live tracker reports one under its STATIC_TILES_S. 0 = off,
  # the observation every run trained on until 2026-10-07; configs/train.yaml sets 2.0.
  projectile_static_speed: 0.0
  # History rings: the hero's last `history_frames` DECISIONS (hp, ammo, position, the action
  # taken, every entity's position and whether the hero saw it), kept in core/state's `hist_*`
  # buffers and pushed at the top of every env.step. They feed the hist.* fields and the
  # enemy_hist1..K grid planes, which draw only within `history_radius_tiles` of the hero now.
  # Changing either changes what a trained checkpoint sees; history_frames also sets the widths.
  history_frames: 3
  history_radius_tiles: 4

entities:
  n_enemies: 9                  # 10 players total: 1 hero + 9 enemies
  randomize_enemy_types: true
  enemy_type_weights: {sniper: 0.22, artillery: 0.15, melee: 0.09, rifle: 0.16,
                       edgar: 0.12, spike: 0.13, bull: 0.13}
  # Only consulted when randomize_enemy_types is false; length must equal n_enemies
  # (core/spawn.sample_enemy_kinds raises otherwise). Kept valid, not just the active default.
  fixed_enemy_types: [sniper, artillery, melee, rifle, edgar, spike, bull, sniper, rifle]
  enemy_hp_mult: 1.0
  enemy_damage_mult: 1.0
  unit_radius: 0.4

# Slot tables. config.peak_projectile_demand bounds the worst-case CONCURRENT projectile count for
# this roster (`n_enemies` copies of the most demanding bot kind, each with a full clip in the
# air), and config.validate raises if it passes max_projectiles, because overflow is silent
# (alloc_slots drops the shot). Spike sets the bound: 9 x (3 shells x 6 shards) = 162 of 192.
# max_boxes and max_pickups size the crate and pickup tables: maps mark at most 44 crate spots,
# and pickups hold one cube per crate plus one drop per corpse (44 + 9). The agent sees crates and
# cubes through the grid's `box` and `pickup` channels, whose shape depends on neither.
limits: {max_projectiles: 192, max_boxes: 48, max_pickups: 64}

# Power cubes, the real game's numbers: each gives +10% damage and a FLAT +400 max HP, so every
# brawler gains the same HP from a cube instead of the tankiest gaining the most.
cubes:
  hp_per_cube: 400                  # real: flat +400 max HP per cube
  damage_bonus_per_cube: 0.10       # real: +10% damage per cube
  max_cubes: 16
  cubes_per_box: 1
  cubes_on_kill_base: 1
  drop_victim_cubes: true
  pickup_radius: 0.6
  # Where a broken crate's cube lands: this many tiles from the crate, in a random direction.
  # Measured on real footage, where cubes pop out 0.3-1.8 tiles from the crate rather than sitting
  # on its tile. A spot a brawler could not stand on (wall, water, off the map) is redrawn, and a
  # crate hemmed in on every draw drops on itself. 0 and 0 drops the cube on the crate.
  box_scatter_min_tiles: 0.3
  box_scatter_max_tiles: 1.8

# n_boxes is clamped to the map's marked spots (core/boxes.spawn_boxes), so 48 fills every spot on
# every shipped map: 16 to 44 crates, 24.2 on average over the 34 training maps. Real showdown
# maps carry 20 to 30 (BRAWL_SIM_DESIGN.md §8).
# `hp` is a constant; real crate HP scales 4500-8500 with the lobby's average power level.
# dash_hits_once: a dash damages each crate once, as it does each unit (user's rule, 2026-10-06).
# false is the old sim, where a crate inside the dash took a hit on every tick (3-5 per dash).
# configs/train.yaml turns it on with hp 8000; this file keeps what finished runs trained on.
boxes: {n_boxes: 48, hp: 3000, dash_hits_once: false}

# The zone deals a FRACTION of each entity's own max HP per second, as the real game does, not a
# flat HP/s: at 0.20 nobody survives more than 5 s inside it, whatever their HP or cubes. Each
# shrink adds 0.04, so by shrink 5 the rate is 0.40 and the zone kills in 2.5 s.
# start_fraction and step_seconds here are the sim's fast default (first gas at 12 s, a tile
# every 1.5 s); training runs take the game-paced schedule from train.yaml.
zone:
  enabled: true
  start_fraction: 0.08
  step_seconds: 1.5
  tiles_per_step: 1
  max_hp_fraction_per_second: 0.20   # 1/0.20 = 5s to die from full
  fraction_growth_per_step: 0.04
  iframes_block_zone: false          # dormant: nothing grants i-frames (the dash has none)
  # OBSERVATION ONLY -- no effect on dynamics. zone.hero_margin_local is zone.hero_margin clamped
  # to +/- this many tiles, the shape the deployed loop can supply: it has no rect, only a sticky
  # map of gas it has SEEN, so past a horizon its answer saturates. brawl_deployment's gas
  # estimator READS this value out of the run's env_config rather than carrying a copy, so there
  # is only ever one. 10 is the knee of an inference-time ablation (BRAWL_DEPLOYMENT_DESIGN.md
  # §9.15).
  margin_horizon_tiles: 10.0

# Out-of-combat regeneration, the real game's values: 13% of the entity's own max HP per second
# once 3.0 s pass with no damage taken (zone included) and no attack, super or gadget used; a full
# heal takes ~7.7 s. A fraction, so heal time is the same for every brawler and cubes don't slow
# it. Regen (780 HP/s on a 6000-HP bot) outpaces Mortis's sustained ~700 damage/s (2000 per
# 0.35 + 2.50 s cycle), so a bot that breaks contact for 3 s recovers: the failure mode to watch
# is DISENGAGEMENT, and the zone is the answer to it.
regen: {enabled: true, delay_seconds: 3.0, max_hp_fraction_per_second: 0.13}

bots:
  break_boxes: true
  collect_cubes: true
  avoid_zone: true

  # --- personalities: what a bot does with its MOVEMENT, drawn per entity per reset and
  # orthogonal to its archetype (see brawl_sim/bots/personality.py). Set false to make every bot
  # a rush.
  personalities: true
  # rush: closes on anything visible.
  # camper: sits in a bush, fires only once it can be seen (on sight from aggression 1.25 up).
  # hunter: sweeps bushes hunting for hidden players.
  # trapper: holds a bush but shoots freely.
  # kite: works the open map holding its archetype's ideal range.
  # Weighted toward hunter+rush on purpose: those two are what punishes a bush-camping hero, the
  # degenerate policy this whole mechanic exists to break.
  personality_weights: {rush: 0.28, camper: 0.12, hunter: 0.24, trapper: 0.16, kite: 0.20}
  # Force at least this many bots per env to draw rush or hunter, so an unlucky roll can never
  # produce a lobby the agent beats by standing still. 0 disables the guarantee.
  min_aggressive: 1
  # Every non-camper bot shoots the crate beside it, within min(5 tiles, attack_range), whenever
  # no enemy is inside its attack range, so the hero has no uncontested access to the cubes.
  attack_boxes: true

  # How far a BOT may acquire and hold a target (tiles); the hero's observation does not use it
  # (brawl_sim/bots/perception.bot_visibility). Without it bots see the whole map and never go
  # looking for anyone. With bush concealment it defines "in view"; walls never block sight.
  # 14 clears every bot attack_range (max 8.0), so bots spot you before they can shoot you.
  # 0 disables the limit.
  sight_tiles: 14.0

  # LOCAL cover search: "where do I duck into", used by camper/trapper. A small radius is correct
  # here -- cover you have to cross the map for is not cover.
  bush_search_tiles: 4          # radius of the shared bush scan; sizes a fixed 49-probe set

  # MAP-SCALE sweep: "where do I go looking", used by hunter and by trapper's idle relocation.
  # One bush waypoint per hunt_cell_tiles-square cell (see brawl_sim/maps/loader.bush_waypoints).
  # Deliberately not bush_search_tiles: a 4-tile radius keeps hunters shuffling around their
  # spawn, and cells make each leg a real journey.
  hunt_cell_tiles: 10           # up to 6x6 = 36 waypoints on a 60x60 map (max 63)
  hunt_arrive_tiles: 2.0        # within this of a waypoint marks it searched
  hunt_timeout_seconds: 12.0    # give up on an unreachable waypoint after this long

  zone_avoid_tiles: 4.0         # start steering inward once this close to the safe rect's edge
  camper_zone_flee_tiles: 2.0   # a camper abandons its bush once clearance drops to this
  wander_seconds: 2.5           # explore-heading re-roll period when nothing is visible

  # The five keys below are SIM_ISSUES_PLAN.md's bot changes (2026-10-06). Each value here keeps
  # the old sim exactly, so every run trained before them replays unchanged; configs/train.yaml
  # turns them on for the next run.
  #
  # Pathfinding (brawl_sim/maps/nav.py): a bot walks a shortest walkable path to its target, bush
  # or waypoint, and out of the gas, instead of steering straight at it and pinning on any wall
  # between. Tables built once per map bank on CPU (~8 s and ~52 MB for 36 maps).
  nav: false
  nav_anchor_tiles: 3           # one path goal per this-square cell; >= 2 (1 would be ~470 MB)
  # Once at most this many players are alive (the hero counts), campers and trappers play as
  # hunters and come looking. 0 never switches.
  endgame_players: 0
  # Seconds of low-pass on the target velocity a bot leads by (bots/policy.track_seen_velocity).
  # 0 leads by the raw per-tick velocity.
  lead_velocity_tau: 0.0
  # Every LEAD/LOB bot aims at the target's current position, as the game's tap auto-aim does.
  tap_aim: false

perception:                     # drives BOT behavior and the revealed_* flags.
  bush_reveal_radius: 2.0       # It never removes data from the observation package.
  reveal_after_attack: 1.0
  los_step_tiles: 0.5
  max_ray_tiles: 24.0

engine: {debug_checks: false, compile: false}
