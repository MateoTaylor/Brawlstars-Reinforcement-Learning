# DEPLOYABLE agent view, the first of the deploy line: configs/agent_obs_lowinfo.yaml minus the
# fields nothing supplies at runtime. Selected per run with
#   python scripts/train.py --set run.agent_obs=configs/agent_obs_deploy.yaml
# Each deploy spec is its own file because a finished run's train.yaml names its spec by path.
#
# WHAT THIS DROPS, RELATIVE TO agent_obs_lowinfo.yaml (the user's call, BRAWL_DEPLOYMENT_DESIGN.md
# §9.8)
# ---------------------------------------------------
# lowinfo's rule is sim-to-real parity: the agent may see only what brawl_vision can recover from
# a screen capture. lowinfo applied it to enemy ARCHETYPE and projectile TYPE; applied field by
# field, four more fail it:
#
#   entities.cubes        Another player's power-cube count is not drawn anywhere on screen. The
#                         cubes themselves are visible as pickups; who has collected how many is
#                         not.
#   entities.can_attack   Another player's ammo state. Same problem -- the ammo bar is drawn for
#                         YOUR brawler only (brawl_vision/object_detection/hp_detection/locate.py
#                         documents the readout stack and says so explicitly).
#   entities.dashing      Recoverable in principle from a speed threshold, but only for brawlers
#                         whose dash we can name -- and entities.kind_onehot is exactly what
#                         lowinfo removed. Keeping this would smuggle back a weak type signal.
#   hero.cubes            The ONE here that CV could supply: the pip row sits in the same box
#                         stack as the hero's own HP bar. Dropped because the user decided no
#                         reader will be built for it, and a field nobody intends to supply is in
#                         the same position as one nobody can.
#
# The alternative to dropping them was feeding a constant into four columns a policy had been
# trained to trust. That is the specific failure this whole line of configs exists to prevent:
# it is silent, and it presents as "the policy is bad at real Brawl Stars".
#
# WHAT THIS REPLACES: hp_frac -> hp, on BOTH sides (BRAWL_DEPLOYMENT_DESIGN.md §9.10)
# ------------------------------------------------
# `hero.hp_frac` and `entities.hp_frac` are `hp / max_hp`, and max_hp is NOT OBSERVABLE. A power
# cube adds a flat +400 to it (configs/default.yaml `cubes.hp_per_cube`), for the hero and for
# every enemy, and nothing on screen says how many cubes anyone is holding -- that is the same
# fact that removed entities.cubes two sections up. Dividing by the kit constant in
# configs/brawlers.yaml gives a number that is correct only until the first cube is picked up.
#
# The fix is not a better denominator, it is no denominator. brawl_vision's HP reader
# (object_detection/hp_detection/read.py) produces the HP NUMERAL and deliberately ships no fill
# ratio -- its docstring explains that the depleted remainder of the bar is a pale wash, so "a
# ratio computed against the filled run alone would be the constant 1.0 dressed up as a
# measurement". So absolute HP is the quantity the pipeline already supplies, for enemies as well
# as the hero, and hp_frac is the one it can supply for NEITHER.
#
# This is also a small information GAIN, not a concession. Base HP spans 6000-10000 across the
# roster, so "50%" could mean 2 Mortis hits or 5; the absolute number distinguishes them. And
# because cubes raise HP above every base value, a large HP reading is itself evidence of a
# cube-fed enemy -- who also hits ~10% harder per cube. hp_frac destroys that signal.
#
# Scale: obs_select normalizes `hp` units by _NORM_HP_SCALE (20000). The largest possible HP, an
# elite 10000-HP bot at 16 cubes (10000 x 1.5 + 16 x 400 = 21400), lands at 1.07; a fresh Mortis
# reads 0.40.
#
# WHAT DELIBERATELY SURVIVES
# --------------------------
#   entities.rel_vel      KEPT, the user's call (BRAWL_DEPLOYMENT_DESIGN.md §9.9), and this is the
#                         line to delete if that changes. It is recoverable:
#                         brawl_deployment/perception/tracker.py produces it, and the odometry
#                         error that inflates absolute speeds cancels in `ent_vel - hero_vel`. It
#                         is the only enemy field carrying motion.
#
#   entities.revealed_to_hero    Not a stat lookup: it is whether the tracker saw this enemy on
#                         THIS tick (Track.seen_now) rather than coasted on a prediction.
#   entities.in_bush      An occupancy-map lookup at the enemy's tile, not a property of the enemy.
#   the `self` group      Proprioception, not perception -- the deployed loop ISSUES the actions,
#                         so the hero's own timers are dead-reckoned exactly from the action stream
#                         plus configs/brawlers.yaml. See BRAWL_DEPLOYMENT_DESIGN.md 6.3. That is
#                         why hero.can_attack stays while entities.can_attack goes; they are the
#                         same quantity from opposite sides of the camera.
#
# NOT A DROP-IN CHECKPOINT SWAP. Narrowing changes the observation width and with it
# BrawlFeaturesExtractor's first linear layer, so no checkpoint trained under agent_obs.yaml or
# agent_obs_lowinfo.yaml can be loaded here. Train from scratch, in its own run directory.
fair: true
normalize: true
groups:
  - name: self                          # lowinfo's self group minus hero.cubes -- see header
    per_entity: false
    dtype: float32
    fields: [hero.pos_norm, hero.vel, hero.facing_vec, hero.hp, hero.ammo_frac,
             hero.ammo_whole, hero.attack_cd, hero.can_attack, hero.dashing,
             hero.dash_t, hero.dash_dir, hero.invuln, hero.in_bush, hero.in_zone,
             hero.long_dash_ready, hero.long_dash_frac,
             hero.super_ready, hero.super_charge_frac,
             meta.time_frac, meta.n_enemies_alive]
  - name: enemies                       # slots 1..n_enemies, index-stable, gated by fair
    per_entity: true
    dtype: float32
    # entities.kind_onehot removed by lowinfo; cubes/can_attack/dashing removed here, and
    # hp_frac swapped for raw hp -- see WHAT THIS REPLACES. What is left is exactly what a
    # detector plus a tracker reports: something is there, where, how far, how fast relative to
    # us, how much HP the numeral over it says, and whether it is in a bush.
    fields: [entities.alive, entities.revealed_to_hero,
             entities.rel_pos, entities.dist, entities.rel_vel, entities.hp,
             entities.in_bush]
  - name: projectiles                   # nearest K by time_to_closest, K = 12 -- NOT index-stable
    per_entity: true
    max_slots: 12
    dtype: float32
    # Unchanged from lowinfo. A moving dot and nothing more.
    fields: [projectiles.alive, projectiles.rel_pos, projectiles.vel,
             projectiles.time_to_closest]
  - name: zone                          # lowinfo's; agent_obs_deploy2.yaml rebuilds it
    per_entity: false
    dtype: float32
    fields: [zone.hero_margin, zone.active, zone.safe_area_frac, zone.next_shrink_in]
  - name: grid                          # bare occupancy counts, no kind, no class -- and two
                                        # channels shorter than lowinfo's. See below.
    dtype: uint8
    # No `box` or `pickup` channel: (8, 13, 21) against lowinfo's (10, 13, 21), so a run on this
    # spec cannot see crates or cubes (BRAWL_DEPLOYMENT_DESIGN.md §9.11); agent_obs_deploy3.yaml
    # adds both back. An agent must not be paid for collecting what it cannot see, so a run on
    # this spec needs `--set reward.cube_pickup=0`, which
    # brawl_sim/training/builder.check_reward_is_observable enforces at run build time.
    view_channels: [blocks_unit, blocks_projectile, is_bush, is_water, in_zone,
                    enemy_revealed, hero, projectile]
